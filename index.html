<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JW Music Library Player</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel Standalone CDN -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css');
        body { font-family: 'Pretendard', sans-serif; background-color: #0f172a; color: #f8fafc; overscroll-behavior-y: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; scroll-behavior: smooth; }
        .bg-glass { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
        .mask-image-vertical {
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 12%, black 88%, transparent);
            mask-image: linear-gradient(to bottom, transparent, black 12%, black 88%, transparent);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased select-none overflow-hidden h-screen w-screen flex items-center justify-center">

    <div id="root" class="h-full w-full max-w-md bg-slate-900 shadow-2xl relative flex flex-col overflow-hidden"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- 백업용 기본 모의 데이터 (JSON 로드 실패 시 방어용) ---
        const FALLBACK_DATABASE = [
            {
                id: "osg_001",
                category: "오리지널송",
                title: "우리 함께 있어요",
                subtitle: "We Are There for Each Other",
                cover_url: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&w=600&q=80",
                audio_urls: {
                    ko: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
                    en: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
                    cn: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"
                },
                has_sync: true,
                lyrics: {
                    ko: [
                        { start: 0, end: 5, text: "어떤 어려움을 겪더라도" },
                        { start: 5, end: 12, text: "우리가 함께라면 이겨낼 수 있어요" },
                        { start: 12, end: 20, text: "달콤한 한마디 우리의 말에는" },
                        { start: 20, end: 35, text: "정말 큰 힘이 있어요 함께라면" }
                    ],
                    en: [
                        { start: 0, end: 5, text: "No matter what trials come our way" },
                        { start: 5, end: 12, text: "We'll stand together, come what may" }
                    ],
                    cn: [
                        { start: 0, end: 5, text: "无论面对什么艰难险阻" },
                        { start: 5, end: 12, text: "只要我们并肩就能战胜一切" }
                    ]
                }
            }
        ];

        function App() {
            const [view, setView] = useState('home'); // 'home' | 'player'
            const [selectedCategory, setSelectedCategory] = useState(null); 
            const [database, setDatabase] = useState(FALLBACK_DATABASE);
            const [playlist, setPlaylist] = useState(FALLBACK_DATABASE);
            const [currentIndex, setCurrentIndex] = useState(0);

            // 재생 상태
            const [isPlaying, setIsPlaying] = useState(false);
            const [currentTime, setCurrentTime] = useState(0);
            const [duration, setDuration] = useState(0);

            // 환경 설정 상태
            const [lang, setLang] = useState('ko'); // ko, en, cn
            const [repeatMode, setRepeatMode] = useState('all'); // 'all' | 'one' | 'shuffle'
            const [showLangModal, setShowLangModal] = useState(false);
            const [isLoading, setIsLoading] = useState(true);

            const audioRef = useRef(null);
            const lyricsContainerRef = useRef(null);
            const activeLyricRef = useRef(null);

            const currentSong = playlist[currentIndex] || playlist[0] || {};

            // 깃헙에 올리신 실제 jw_multilingual_data.json 불러오기
            useEffect(() => {
                fetch('songs.json')
                    .then(res => res.json())
                    .then(data => {
                        if (Array.isArray(data) && data.length > 0) {
                            // 파이썬 크롤러 구조에 맞게 데이터 가공 보완
                            const formatted = data.map(item => ({
                                id: item.natural_key || item.id,
                                category: item.category || "오리지널송",
                                title: item.title,
                                subtitle: item.subtitle || item.category,
                                cover_url: item.cover_url || "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&w=600&q=80",
                                audio_urls: item.audio_urls || { ko: item.url },
                                has_sync: item.scripts && Object.keys(item.scripts).length > 0,
                                lyrics: item.scripts || {}
                            }));
                            setDatabase(formatted);
                            setPlaylist(formatted);
                        }
                        setIsLoading(false);
                    })
                    .catch(err => {
                        console.log("JSON load failed, using fallback:", err);
                        setIsLoading(false);
                    });
            }, []);

            // 오디오 이벤트 세팅
            useEffect(() => {
                const audio = audioRef.current;
                if (!audio) return;

                const updateTime = () => setCurrentTime(audio.currentTime);
                const updateMeta = () => setDuration(audio.duration || 0);
                const handleEnded = () => {
                    if (repeatMode === 'one') {
                        audio.currentTime = 0;
                        audio.play().catch(() => {});
                    } else {
                        handleNext();
                    }
                };

                audio.addEventListener('timeupdate', updateTime);
                audio.addEventListener('loadedmetadata', updateMeta);
                audio.addEventListener('ended', handleEnded);

                return () => {
                    audio.removeEventListener('timeupdate', updateTime);
                    audio.removeEventListener('loadedmetadata', updateMeta);
                    audio.removeEventListener('ended', handleEnded);
                };
            }, [currentIndex, repeatMode, playlist]);

            const togglePlay = (e) => {
                if (e) e.stopPropagation();
                const audio = audioRef.current;
                if (!audio) return;

                if (isPlaying) {
                    audio.pause();
                } else {
                    audio.play().catch(err => console.log("Play error:", err));
                }
                setIsPlaying(!isPlaying);
            };

            const handleNext = (e) => {
                if (e) e.stopPropagation();
                if (!playlist || playlist.length === 0) return;

                if (repeatMode === 'shuffle') {
                    setCurrentIndex(Math.floor(Math.random() * playlist.length));
                } else {
                    setCurrentIndex((prev) => (prev + 1) % playlist.length);
                }
                setIsPlaying(true);
                setTimeout(() => { if (audioRef.current) audioRef.current.play().catch(()=>{}); }, 50);
            };

            const handlePrev = (e) => {
                if (e) e.stopPropagation();
                if (!playlist || playlist.length === 0) return;

                if (currentTime > 3) {
                    if (audioRef.current) audioRef.current.currentTime = 0;
                } else {
                    setCurrentIndex((prev) => (prev - 1 + playlist.length) % playlist.length);
                }
                setIsPlaying(true);
                setTimeout(() => { if (audioRef.current) audioRef.current.play().catch(()=>{}); }, 50);
            };

            const handleCategoryAction = (categoryName, mode) => {
                const filtered = categoryName 
                    ? database.filter(item => item.category === categoryName)
                    : database;
                
                if (filtered.length === 0) return;
                setPlaylist(filtered);
                setRepeatMode(mode === 'shuffle' ? 'shuffle' : 'all');
                
                const targetIdx = mode === 'shuffle' ? Math.floor(Math.random() * filtered.length) : 0;
                setCurrentIndex(targetIdx);
                setView('player');
                setIsPlaying(true);
                setTimeout(() => { if (audioRef.current) audioRef.current.play().catch(()=>{}); }, 50);
            };

            const startPlaySong = (index, list) => {
                setPlaylist(list);
                setCurrentIndex(index);
                setView('player');
                setIsPlaying(true);
                setTimeout(() => { if (audioRef.current) audioRef.current.play().catch(()=>{}); }, 50);
            };

            const toggleRepeatMode = () => {
                if (repeatMode === 'all') setRepeatMode('one');
                else if (repeatMode === 'one') setRepeatMode('shuffle');
                else setRepeatMode('all');
            };

            const formatTime = (time) => {
                if (isNaN(time)) return "0:00";
                const m = Math.floor(time / 60);
                const s = Math.floor(time % 60);
                return `${m}:${s.toString().padStart(2, '0')}`;
            };

            // 가사 추출 및 매칭
            const activeLyrics = (currentSong?.has_sync && currentSong?.lyrics) 
                ? (currentSong.lyrics[lang] || currentSong.lyrics['ko'] || currentSong.lyrics['KO'] || []) 
                : [];
                
            const activeIndex = activeLyrics.findIndex((line, idx) => {
                const nextLine = activeLyrics[idx + 1];
                return currentTime >= line.start && (!nextLine || currentTime < nextLine.start);
            });

            useEffect(() => {
                if (view === 'player' && activeLyricRef.current && lyricsContainerRef.current) {
                    activeLyricRef.current.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }, [activeIndex, view]);

            const renderHomeView = () => {
                const categories = [...new Set(database.map(item => item.category))];
                const activeList = selectedCategory 
                    ? database.filter(item => item.category === selectedCategory)
                    : database;

                return (
                    <div className="flex flex-col h-full bg-[#0f172a] text-slate-100 relative">
                        {/* 1번 사진 스타일 상단 바 */}
                        <div className="bg-[#4c3b6b] text-white px-4 pt-12 pb-3 flex items-center justify-between shadow-lg z-10">
                            <button onClick={() => setSelectedCategory(null)} className="text-sm font-semibold opacity-90 hover:opacity-100 flex items-center gap-1">
                                {selectedCategory ? '← 라이브러리' : '메뉴'}
                            </button>
                            <div className="text-base font-bold tracking-wide text-center truncate max-w-[180px]">
                                {selectedCategory || 'JW 오디오 라이브러리'}
                            </div>
                            <button onClick={() => setShowLangModal(true)} className="px-2.5 py-1 rounded-full bg-white/10 text-xs font-bold uppercase hover:bg-white/25 transition">
                                {lang}
                            </button>
                        </div>

                        {/* 전체/임의 재생 버튼 영역 */}
                        <div className="p-4 grid grid-cols-2 gap-3 bg-slate-900 border-b border-slate-800 shadow-sm">
                            <button 
                                onClick={() => handleCategoryAction(selectedCategory, 'all')}
                                className="bg-slate-800/80 border border-purple-500/40 text-purple-300 py-3 rounded-2xl font-bold flex items-center justify-center gap-2 hover:bg-purple-900/30 transition active:scale-[0.98]"
                            >
                                <svg className="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                                전체 재생
                            </button>
                            <button 
                                onClick={() => handleCategoryAction(selectedCategory, 'shuffle')}
                                className="bg-slate-800/80 border border-purple-500/40 text-purple-300 py-3 rounded-2xl font-bold flex items-center justify-center gap-2 hover:bg-purple-900/30 transition active:scale-[0.98]"
                            >
                                <svg className="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
                                임의 재생
                            </button>
                        </div>

                        {/* 목록 뷰 (카테고리 선택 혹은 곡 리스트 + 썸네일 대폭 강화) */}
                        <div className="flex-1 overflow-y-auto pb-28 px-4 py-3 space-y-3">
                            {isLoading ? (
                                <div className="text-center py-20 text-slate-400 font-medium">데이터를 불러오는 중입니다...</div>
                            ) : !selectedCategory ? (
                                <div className="space-y-2">
                                    <div className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">오디오 카테고리 선택</div>
                                    {categories.map((cat, idx) => (
                                        <div 
                                            key={idx}
                                            onClick={() => setSelectedCategory(cat)}
                                            className="bg-slate-900/90 p-4 rounded-2xl shadow-md border border-slate-800 flex items-center justify-between cursor-pointer hover:border-purple-500 transition group"
                                        >
                                            <div className="flex items-center gap-3.5">
                                                <div className="w-12 h-12 rounded-xl bg-[#4c3b6b]/40 text-purple-300 flex items-center justify-center font-bold text-xl shadow-inner">
                                                    🎵
                                                </div>
                                                <span className="font-bold text-slate-100 text-base group-hover:text-purple-300 transition">{cat}</span>
                                            </div>
                                            <svg className="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7"/></svg>
                                        </div>
                                    ))}
                                </div>
                            ) : (
                                <div className="space-y-2">
                                    <div className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">{selectedCategory} 목록 ({activeList.length}곡)</div>
                                    {activeList.map((song, idx) => {
                                        const globalIdx = database.findIndex(s => s.id === song.id);
                                        return (
                                            <div 
                                                key={song.id || idx}
                                                onClick={() => startPlaySong(globalIdx, activeList)}
                                                className="bg-slate-900/90 p-3 rounded-2xl shadow-md border border-slate-800 flex items-center gap-4 cursor-pointer hover:bg-slate-800/60 transition group"
                                            >
                                                <img 
                                                    src={song.cover_url} 
                                                    onError={(e) => { e.target.src = "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&w=600&q=80"; }}
                                                    className="w-14 h-14 rounded-xl object-cover shadow-md border border-slate-700" 
                                                    alt="cover"
                                                />
                                                <div className="flex-1 min-w-0">
                                                    <h4 className="font-bold text-slate-100 text-base truncate group-hover:text-purple-300 transition">{song.title}</h4>
                                                    <p className="text-xs text-slate-400 truncate mt-0.5">{song.subtitle || song.category}</p>
                                                </div>
                                                <button className="w-10 h-10 rounded-full bg-purple-950/60 text-purple-300 flex items-center justify-center font-bold shadow-sm">▶</button>
                                            </div>
                                        );
                                    })}
                                </div>
                            )}
                        </div>

                        {/* 하단 미니 플레이어 */}
                        {currentSong && currentSong.title && (
                            <div className="fixed bottom-0 w-full max-w-md mx-auto z-20 px-3 pb-4 pt-2 bg-gradient-to-t from-slate-950 via-slate-900/90 to-transparent">
                                <div 
                                    onClick={() => setView('player')}
                                    className="bg-glass border border-slate-800 shadow-2xl rounded-2xl p-2.5 flex items-center gap-3 cursor-pointer active:scale-[0.98] transition-transform"
                                >
                                    <img src={currentSong.cover_url} className="w-12 h-12 rounded-xl object-cover shadow-md border border-slate-700" alt="cover"/>
                                    <div className="flex-1 min-w-0">
                                        <div className="text-sm font-bold text-slate-100 truncate">{currentSong.title}</div>
                                        <div className="text-xs text-slate-400 truncate">{currentSong.subtitle || currentSong.category}</div>
                                    </div>
                                    <div className="flex items-center gap-2 pr-1">
                                        <button onClick={togglePlay} className="w-10 h-10 rounded-full bg-slate-100 text-slate-950 flex items-center justify-center font-bold hover:bg-white transition shadow-md">
                                            {isPlaying ? '❚❚' : '▶'}
                                        </button>
                                        <button onClick={handleNext} className="w-10 h-10 flex items-center justify-center text-slate-300 font-bold text-lg">
                                            ⏭
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                );
            };

            const renderPlayerView = () => (
                <div className="flex flex-col h-full relative overflow-hidden bg-slate-950 text-white">
                    {/* 배경 블러 처리 (앨범 아트 기반) */}
                    <div className="absolute inset-0 z-0">
                        <img src={currentSong?.cover_url} className="w-full h-full object-cover opacity-25 blur-[60px] scale-125" alt="bg" />
                        <div className="absolute inset-0 bg-gradient-to-b from-black/70 via-black/40 to-black/95"></div>
                    </div>

                    {/* 상단 네비게이션 */}
                    <div className="relative z-10 flex items-center justify-between px-6 pt-12 pb-4 border-b border-white/10 backdrop-blur-md">
                        <button onClick={() => setView('home')} className="flex items-center gap-1 text-white/80 hover:text-white font-semibold text-sm">
                            <span className="text-lg">‹</span> 뒤로
                        </button>
                        <div className="text-center min-w-0">
                            <h3 className="text-sm font-bold text-white truncate max-w-[180px]">{currentSong?.title}</h3>
                            <p className="text-[11px] text-white/50 truncate">{currentSong?.category}</p>
                        </div>
                        <button onClick={() => setShowLangModal(true)} className="px-3 py-1 rounded-full bg-white/15 font-bold text-xs uppercase hover:bg-white/25 transition">
                            {lang}
                        </button>
                    </div>

                    {/* 중앙 가사 뷰어 영역 (시인성 극대화) */}
                    <div ref={lyricsContainerRef} className="relative z-10 flex-1 overflow-y-auto no-scrollbar px-6 w-full mask-image-vertical py-12">
                        {currentSong?.has_sync ? (
                            <div className="py-[32vh] space-y-8 text-left">
                                {activeLyrics.length === 0 ? (
                                    <div className="text-center text-white/40 font-medium">선택한 언어의 가사 데이터가 없습니다.</div>
                                ) : (
                                    activeLyrics.map((line, idx) => {
                                        const isActive = idx === activeIndex;
                                        const isPast = idx < activeIndex;
                                        return (
                                            <div 
                                                key={idx}
                                                ref={isActive ? activeLyricRef : null}
                                                onClick={() => { if (audioRef.current) audioRef.current.currentTime = line.start; }}
                                                className={`transition-all duration-300 ease-out cursor-pointer ${
                                                    isActive 
                                                        ? 'text-white text-3xl md:text-4xl font-extrabold tracking-tight drop-shadow-lg scale-105' 
                                                        : isPast
                                                        ? 'text-white/30 text-xl md:text-2xl font-semibold blur-[0.4px]'
                                                        : 'text-white/30 text-xl md:text-2xl font-semibold hover:text-white/60'
                                                }`}
                                            >
                                                {line.text}
                                            </div>
                                        );
                                    })
                                )}
                            </div>
                        ) : (
                            <div className="py-6 text-center text-white/50 font-medium">
                                싱크 가사가 지원되지 않는 미디어입니다.
                            </div>
                        )}
                    </div>

                    {/* 하단 고정 컨트롤러 */}
                    <div className="relative z-20 bg-black/85 backdrop-blur-2xl pt-5 pb-8 px-6 border-t border-white/10 shadow-2xl">
                        {/* 프로그레스 바 */}
                        <div className="mb-5 space-y-1.5">
                            <div className="relative w-full h-1.5 bg-white/20 rounded-full cursor-pointer overflow-hidden">
                                <input
                                    type="range"
                                    min={0} max={duration || 100} value={currentTime}
                                    onChange={(e) => {
                                        const val = Number(e.target.value);
                                        setCurrentTime(val);
                                        if (audioRef.current) audioRef.current.currentTime = val;
                                    }}
                                    className="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10"
                                />
                                <div 
                                    className="absolute top-0 left-0 h-full bg-white rounded-full transition-all duration-75 ease-linear"
                                    style={{ width: `${(currentTime / (duration || 1)) * 100}%` }}
                                ></div>
                            </div>
                            <div className="flex justify-between text-[11px] font-medium text-white/40 px-0.5">
                                <span>{formatTime(currentTime)}</span>
                                <span>{formatTime(duration)}</span>
                            </div>
                        </div>

                        {/* 컨트롤 버튼 그룹 */}
                        <div className="flex items-center justify-between">
                            <button onClick={toggleRepeatMode} className={`p-2 transition font-bold text-xs flex flex-col items-center gap-0.5 ${repeatMode !== 'all' ? 'text-purple-400' : 'text-white/50 hover:text-white'}`}>
                                <span className="text-lg">
                                    {repeatMode === 'one' ? '🔂' : repeatMode === 'shuffle' ? '🔀' : '🔁'}
                                </span>
                                <span className="text-[9px] uppercase">{repeatMode}</span>
                            </button>

                            <div className="flex items-center gap-5">
                                <button onClick={handlePrev} className="text-white/80 hover:text-white transition p-2 active:scale-90 text-2xl font-bold">
                                    ⏮
                                </button>
                                
                                <button onClick={togglePlay} className="w-16 h-16 bg-white text-slate-950 rounded-full flex items-center justify-center shadow-xl hover:scale-105 active:scale-95 transition-transform text-2xl font-bold pl-1">
                                    {isPlaying ? '❚❚' : '▶'}
                                </button>

                                <button onClick={handleNext} className="text-white/80 hover:text-white transition p-2 active:scale-90 text-2xl font-bold">
                                    ⏭
                                </button>
                            </div>

                            <button onClick={() => setShowLangModal(true)} className="p-2 text-white/60 hover:text-white transition text-xs font-semibold flex flex-col items-center gap-0.5">
                                <span className="text-lg">🌐</span>
                                <span className="text-[9px] uppercase">{lang}</span>
                            </button>
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="h-full w-full bg-black relative flex flex-col justify-between">
                    {view === 'home' ? renderHomeView() : renderPlayerView()}

                    {/* 언어 선택 모달 */}
                    {showLangModal && (
                        <div className="fixed inset-0 z-50 flex items-end justify-center bg-black/60 backdrop-blur-sm sm:items-center sm:p-4">
                            <div className="bg-slate-900 border border-slate-800 w-full max-w-md sm:rounded-3xl rounded-t-3xl p-6 shadow-2xl text-slate-100">
                                <div className="flex justify-between items-center mb-6">
                                    <h3 className="text-xl font-bold">가사 언어 선택 (Language)</h3>
                                    <button onClick={() => setShowLangModal(false)} className="p-2 bg-slate-800 rounded-full text-slate-400 hover:text-white">
                                        ✕
                                    </button>
                                </div>
                                <div className="space-y-3">
                                    {[
                                        { code: 'ko', label: '한국어', native: 'Korean' },
                                        { code: 'en', label: 'English', native: '영어' },
                                        { code: 'cn', label: '中文', native: '중국어' }
                                    ].map((item) => (
                                        <button
                                            key={item.code}
                                            onClick={() => { setLang(item.code); setShowLangModal(false); }}
                                            className={`w-full py-4 px-5 rounded-2xl flex items-center justify-between transition border-2 ${
                                                lang === item.code 
                                                    ? 'border-purple-500 bg-purple-950/40 text-purple-300' 
                                                    : 'border-transparent bg-slate-800/60 text-slate-300 hover:bg-slate-800'
                                            }`}
                                        >
                                            <div className="flex flex-col items-start">
                                                <span className="text-base font-bold">{item.label}</span>
                                                <span className="text-xs opacity-70">{item.native}</span>
                                            </div>
                                            {lang === item.code && (
                                                <span className="text-lg font-bold">✓</span>
                                            )}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 오디오 태그 (언어를 바꿔도 재생 유지) */}
                    <audio 
                        ref={audioRef} 
                        src={currentSong?.audio_urls ? (currentSong.audio_urls[lang] || currentSong.audio_urls['ko'] || currentSong.audio_urls['KO']) : currentSong?.url} 
                        preload="metadata" 
                    />
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
