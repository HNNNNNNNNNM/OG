<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JW Music Library Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css');
        body { font-family: 'Pretendard', sans-serif; background-color: #f4f4f6; color: #333; overscroll-behavior-y: none; }
        
        /* 스크롤바 숨기기 및 스무스 스크롤 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; scroll-behavior: smooth; }
        
        /* 배경 블러 애니메이션 */
        .bg-glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .dark-glass { background: rgba(30, 30, 40, 0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
    </style>
</head>
<body class="bg-slate-900 text-slate-800 antialiased select-none overflow-hidden h-screen w-screen">
    <div id="root" class="h-full w-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const MOCK_DATABASE = [
            {
                id: "osg_001",
                category: "오리지널송",
                number: null,
                title: "우리 함께 있어요",
                subtitle: "We Are There for Each Other",
                cover_url: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&w=300&q=80",
                audio_urls: {
                    ko: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
                    en: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
                    cn: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"
                },
                has_sync: true,
                lyrics: {
                    ko: [
                        { start: 0, end: 5, text: "어떤 어려움을 겪더라도" },
                        { start: 5, end: 12, text: "우리가 함께라면 이겨낼 수 있어요" },
                        { start: 12, end: 20, text: "달콤한 한마디 우리의 말에는" },
                        { start: 20, end: 35, text: "정말 큰 힘이 있어요 함께라면" },
                        { start: 35, end: 45, text: "서로의 손을 굳게 맞잡고" },
                        { start: 45, end: 60, text: "사랑으로 모든 걸 이겨내요" }
                    ],
                    en: [
                        { start: 0, end: 5, text: "No matter what trials come our way" },
                        { start: 5, end: 12, text: "We'll stand together, come what may" },
                        { start: 12, end: 20, text: "A gentle word can heal and bless" },
                        { start: 20, end: 35, text: "Bringing true peace and happiness" },
                        { start: 35, end: 45, text: "Holding hands so firm and strong" },
                        { start: 45, end: 60, text: "Love will keep us righting wrong" }
                    ],
                    cn: [
                        { start: 0, end: 5, text: "无论面对什么艰难险阻" },
                        { start: 5, end: 12, text: "只要我们并肩就能战胜一切" },
                        { start: 12, end: 20, text: "一句温言充满着力量" },
                        { start: 20, end: 35, text: "带给我们无限的安慰" },
                        { start: 35, end: 45, text: "紧紧相握彼此的双手" },
                        { start: 45, end: 60, text: "用爱心战胜所有愁忧" }
                    ]
                }
            },
            {
                id: "osg_002",
                category: "오리지널송",
                number: null,
                title: "달콤한 한마디",
                subtitle: "A Gentle Word",
                cover_url: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?auto=format&fit=crop&w=300&q=80",
                audio_urls: {
                    ko: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",
                    en: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",
                    cn: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"
                },
                has_sync: true,
                lyrics: {
                    ko: [
                        { start: 0, end: 6, text: "지친 마음을 위로하는 그 말" },
                        { start: 6, end: 15, text: "상처받은 영혼을 감싸 안아주네" },
                        { start: 15, end: 25, text: "따뜻한 미소 하나에" },
                        { start: 25, end: 40, text: "얼어붙은 마음이 녹아내려요" }
                    ]
                }
            },
            {
                id: "sjj_008",
                category: "'기쁨으로 여호와께 노래하라'—노래",
                number: 8,
                title: "여호와는 우리의 도피처",
                subtitle: "시편 91",
                cover_url: "https://images.unsplash.com/photo-1456513080510-7bf3a84b82f8?auto=format&fit=crop&w=300&q=80",
                audio_urls: {
                    ko: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3",
                    en: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3",
                    cn: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3"
                },
                has_sync: false,
                static_lyrics: {
                    ko: [
                        "1. 여호와 하느님은 우리의 도피처,",
                        "그 보호 그늘 아래 항상 머물리라.",
                        "견고한 산성과 같이 늘 충실하신 여호와,",
                        "굳건히 의지하면 항상 지켜 주시리라.",
                        "",
                        "2. 만 인이 내 곁에서 쓰러질지라도",
                        "의롭고 온유한 자 늘 보호받으리.",
                        "그 어떤 재앙이라도 우릴 해치지 못하리.",
                        "하느님 날개 아래 우린 안전히 거하리."
                    ]
                }
            }
        ];

        function App() {
            const [view, setView] = useState('home'); // 'home' | 'player'
            const [playlist, setPlaylist] = useState(MOCK_DATABASE);
            const [currentIndex, setCurrentIndex] = useState(0);
            
            const [isPlaying, setIsPlaying] = useState(false);
            const [currentTime, setCurrentTime] = useState(0);
            const [duration, setDuration] = useState(0);
            
            const [lang, setLang] = useState('ko');
            const [repeatMode, setRepeatMode] = useState('all'); // 'all', 'one', 'shuffle'
            const [showLangModal, setShowLangModal] = useState(false);

            const audioRef = useRef(null);
            const lyricsContainerRef = useRef(null);
            const activeLyricRef = useRef(null);
            
            const currentSong = playlist[currentIndex] || null;

            useEffect(() => {
                const audio = audioRef.current;
                if (!audio) return;

                const updateTime = () => setCurrentTime(audio.currentTime);
                const updateMeta = () => setDuration(audio.duration || 0);
                const handleEnded = () => {
                    if (repeatMode === 'one') {
                        audio.currentTime = 0;
                        audio.play().catch(() => {});
                    } else {
                        handleNext();
                    }
                };

                audio.addEventListener('timeupdate', updateTime);
                audio.addEventListener('loadedmetadata', updateMeta);
                audio.addEventListener('ended', handleEnded);

                return () => {
                    audio.removeEventListener('timeupdate', updateTime);
                    audio.removeEventListener('loadedmetadata', updateMeta);
                    audio.removeEventListener('ended', handleEnded);
                };
            }, [currentIndex, repeatMode, playlist]);

            const togglePlay = (e) => {
                if(e) e.stopPropagation();
                const audio = audioRef.current;
                if (!audio) return;
                
                if (isPlaying) {
                    audio.pause();
                } else {
                    audio.play().catch(err => console.log("Play error:", err));
                }
                setIsPlaying(!isPlaying);
            };

            const handleNext = (e) => {
                if(e) e.stopPropagation();
                if (!playlist || playlist.length === 0) return;
                
                if (repeatMode === 'shuffle') {
                    setCurrentIndex(Math.floor(Math.random() * playlist.length));
                } else {
                    setCurrentIndex((prev) => (prev + 1) % playlist.length);
                }
                setIsPlaying(true);
                setTimeout(() => { if (audioRef.current) audioRef.current.play(); }, 50);
            };

            const handlePrev = (e) => {
                if(e) e.stopPropagation();
                if (!playlist || playlist.length === 0) return;
                
                if (currentTime > 3) {
                    // 3초 이상 재생되었으면 현재 곡 처음으로
                    if(audioRef.current) audioRef.current.currentTime = 0;
                } else {
                    // 아니면 이전 곡으로
                    setCurrentIndex((prev) => (prev - 1 + playlist.length) % playlist.length);
                }
                setIsPlaying(true);
                setTimeout(() => { if (audioRef.current) audioRef.current.play(); }, 50);
            };

            const startPlaySong = (index) => {
                setCurrentIndex(index);
                setView('player');
                setIsPlaying(true);
                setTimeout(() => { if (audioRef.current) audioRef.current.play(); }, 50);
            };

            const toggleRepeatMode = () => {
                if (repeatMode === 'all') setRepeatMode('one');
                else if (repeatMode === 'one') setRepeatMode('shuffle');
                else setRepeatMode('all');
            };

            const formatTime = (time) => {
                if (isNaN(time)) return "0:00";
                const m = Math.floor(time / 60);
                const s = Math.floor(time % 60);
                return `${m}:${s.toString().padStart(2, '0')}`;
            };

            const activeLyrics = (currentSong?.has_sync && currentSong.lyrics) 
                ? (currentSong.lyrics[lang] || currentSong.lyrics['ko'] || []) 
                : [];
                
            const activeIndex = activeLyrics.findIndex((line, idx) => {
                const nextLine = activeLyrics[idx + 1];
                return currentTime >= line.start && (!nextLine || currentTime < nextLine.start);
            });

            const staticLines = (!currentSong?.has_sync && currentSong?.static_lyrics)
                ? (currentSong.static_lyrics[lang] || currentSong.static_lyrics['ko'] || [])
                : [];

            // 가사 자동 스크롤 로직
            useEffect(() => {
                if (view === 'player' && activeLyricRef.current && lyricsContainerRef.current) {
                    activeLyricRef.current.scrollIntoView({
                        behavior: 'smooth',
                        block: 'center',
                    });
                }
            }, [activeIndex, view]);


            const renderHomeView = () => (
                <div className="flex flex-col h-full bg-white relative">
                    {/* Header */}
                    <div className="bg-[#4c3b6b] text-white px-4 pt-12 pb-4 flex items-center justify-between shadow-md z-10 relative">
                        <div className="text-sm font-semibold opacity-80" onClick={() => setShowLangModal(true)}>
                            {lang === 'ko' ? '한국어 ▼' : lang === 'en' ? 'English ▼' : '中文 ▼'}
                        </div>
                        <div className="text-lg font-bold tracking-wide">라이브러리</div>
                        <div className="w-16"></div> {/* Spacer for centering */}
                    </div>

                    {/* Action Buttons */}
                    <div className="p-4 grid grid-cols-2 gap-3 bg-slate-50 border-b border-slate-200">
                        <button 
                            onClick={() => { setRepeatMode('all'); startPlaySong(0); }}
                            className="bg-white border border-[#4c3b6b] text-[#4c3b6b] py-3 rounded-xl font-bold flex items-center justify-center gap-2 shadow-sm hover:bg-purple-50 transition"
                        >
                            <svg className="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                            전체 재생
                        </button>
                        <button 
                            onClick={() => { setRepeatMode('shuffle'); startPlaySong(Math.floor(Math.random() * playlist.length)); }}
                            className="bg-white border border-[#4c3b6b] text-[#4c3b6b] py-3 rounded-xl font-bold flex items-center justify-center gap-2 shadow-sm hover:bg-purple-50 transition"
                        >
                            <svg className="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
                            임의 재생
                        </button>
                    </div>

                    {/* Song List with Thumbnails */}
                    <div className="flex-1 overflow-y-auto pb-28">
                        <div className="px-4 py-3 text-xs font-bold text-slate-400 uppercase tracking-wider">
                            모든 곡 ({playlist.length})
                        </div>
                        <div className="divide-y divide-slate-100 px-2">
                            {playlist.map((song, idx) => (
                                <div 
                                    key={song.id} 
                                    onClick={() => startPlaySong(idx)}
                                    className={`flex items-center gap-4 p-3 rounded-2xl cursor-pointer transition ${idx === currentIndex ? 'bg-purple-50/80' : 'hover:bg-slate-50'}`}
                                >
                                    <div className="relative w-14 h-14 rounded-lg overflow-hidden flex-shrink-0 shadow-sm border border-slate-200">
                                        <img src={song.cover_url} className="w-full h-full object-cover" alt="cover" />
                                        {idx === currentIndex && isPlaying && (
                                            <div className="absolute inset-0 bg-black/30 flex items-center justify-center">
                                                <svg className="w-6 h-6 text-white animate-pulse" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                                            </div>
                                        )}
                                    </div>
                                    <div className="flex-1 min-w-0">
                                        <h3 className={`text-base font-bold truncate ${idx === currentIndex ? 'text-[#4c3b6b]' : 'text-slate-900'}`}>
                                            {song.title}
                                        </h3>
                                        <p className="text-xs text-slate-500 truncate mt-0.5">{song.category}</p>
                                    </div>
                                    <button className="text-slate-400 hover:text-[#4c3b6b] p-2">
                                        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"/></svg>
                                    </button>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* Floating Mini Player */}
                    {currentSong && (
                        <div className="fixed bottom-0 w-full max-w-md mx-auto z-20 px-2 pb-4 pt-2 bg-gradient-to-t from-white via-white to-transparent">
                            <div 
                                onClick={() => setView('player')}
                                className="bg-glass border border-slate-200 shadow-xl rounded-2xl p-2 flex items-center gap-3 cursor-pointer active:scale-[0.98] transition-transform"
                            >
                                <img src={currentSong.cover_url} className="w-12 h-12 rounded-xl object-cover shadow-sm" alt="cover"/>
                                <div className="flex-1 min-w-0">
                                    <div className="text-sm font-bold text-slate-900 truncate">{currentSong.title}</div>
                                    <div className="text-xs text-slate-500 truncate">{currentSong.subtitle || currentSong.category}</div>
                                </div>
                                <div className="flex items-center gap-2 pr-2">
                                    <button onClick={togglePlay} className="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center text-slate-900 hover:bg-slate-200 transition">
                                        {isPlaying ? (
                                            <svg className="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                                        ) : (
                                            <svg className="w-4 h-4 fill-current ml-1" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                                        )}
                                    </button>
                                    <button onClick={handleNext} className="w-10 h-10 flex items-center justify-center text-slate-600 hover:text-slate-900 transition">
                                        <svg className="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );

            const renderPlayerView = () => (
                <div className="flex flex-col h-full relative overflow-hidden bg-slate-900">
                    {/* Blurred Background Art */}
                    <div className="absolute inset-0 z-0">
                        <img src={currentSong?.cover_url} className="w-full h-full object-cover opacity-40 blur-[40px] scale-125" alt="bg" />
                        <div className="absolute inset-0 bg-gradient-to-b from-black/40 via-black/20 to-black/80"></div>
                    </div>

                    {/* Top Navigation */}
                    <div className="relative z-10 flex items-center justify-between px-6 pt-12 pb-2">
                        <button onClick={() => setView('home')} className="p-2 -ml-2 text-white/80 hover:text-white transition">
                            <svg className="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M19 9l-7 7-7-7"/></svg>
                        </button>
                        <div className="text-xs font-bold text-white/70 tracking-widest uppercase bg-black/20 px-3 py-1 rounded-full backdrop-blur-md">
                            {currentSong?.category}
                        </div>
                        <button onClick={() => setShowLangModal(true)} className="p-2 -mr-2 text-white/80 hover:text-white font-bold text-sm">
                            {lang.toUpperCase()}
                        </button>
                    </div>

                    {/* Lyrics Area (Dynamic Focus) */}
                    <div ref={lyricsContainerRef} className="relative z-10 flex-1 overflow-y-auto no-scrollbar px-6 w-full mask-image-vertical pb-8">
                        {currentSong?.has_sync ? (
                            <div className="py-[40vh] space-y-8">
                                {activeLyrics.length === 0 ? (
                                    <div className="text-center text-white/50 font-medium">가사 데이터가 없습니다.</div>
                                ) : (
                                    activeLyrics.map((line, idx) => {
                                        const isActive = idx === activeIndex;
                                        const isPast = idx < activeIndex;
                                        return (
                                            <div 
                                                key={idx}
                                                ref={isActive ? activeLyricRef : null}
                                                onClick={() => { if(audioRef.current) audioRef.current.currentTime = line.start; }}
                                                className={`transition-all duration-500 ease-out cursor-pointer origin-left ${
                                                    isActive 
                                                        ? 'text-white text-3xl md:text-4xl font-bold opacity-100 scale-100 blur-none' 
                                                        : isPast
                                                        ? 'text-white/40 text-xl md:text-2xl font-semibold opacity-40 scale-95 blur-[0.5px]'
                                                        : 'text-white/30 text-xl md:text-2xl font-semibold opacity-30 scale-95 hover:text-white/60'
                                                }`}
                                            >
                                                {line.text}
                                            </div>
                                        );
                                    })
                                )}
                            </div>
                        ) : (
                            <div className="py-12 space-y-6">
                                {staticLines.length === 0 ? (
                                    <div className="text-center text-white/50 font-medium">가사 데이터가 없습니다.</div>
                                ) : (
                                    staticLines.map((line, idx) => (
                                        <div key={idx} className="text-white/90 text-lg md:text-xl font-medium leading-relaxed">
                                            {line}
                                        </div>
                                    ))
                                )}
                            </div>
                        )}
                    </div>

                    {/* Bottom Fixed Controller */}
                    <div className="relative z-20 bg-gradient-to-t from-black/90 via-black/80 to-transparent pt-12 pb-8 px-6">
                        {/* Song Info Row */}
                        <div className="flex items-center gap-4 mb-6">
                            <img src={currentSong?.cover_url} className="w-16 h-16 rounded-xl object-cover shadow-2xl border border-white/10" alt="cover"/>
                            <div className="flex-1 min-w-0">
                                <h2 className="text-xl font-bold text-white truncate">{currentSong?.title}</h2>
                                <p className="text-sm text-white/60 truncate mt-0.5">{currentSong?.subtitle || 'JW Music'}</p>
                            </div>
                        </div>

                        {/* Progress Bar */}
                        <div className="mb-6 space-y-2">
                            <div className="relative w-full h-1.5 bg-white/20 rounded-full cursor-pointer overflow-hidden group">
                                <input
                                    type="range"
                                    min={0} max={duration || 100} value={currentTime}
                                    onChange={(e) => {
                                        const val = Number(e.target.value);
                                        setCurrentTime(val);
                                        if (audioRef.current) audioRef.current.currentTime = val;
                                    }}
                                    className="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10"
                                />
                                {/* Custom Progress Fill */}
                                <div 
                                    className="absolute top-0 left-0 h-full bg-white rounded-full transition-all duration-100 ease-linear"
                                    style={{ width: `${(currentTime / (duration || 1)) * 100}%` }}
                                ></div>
                            </div>
                            <div className="flex justify-between text-xs font-medium text-white/50 px-1">
                                <span>{formatTime(currentTime)}</span>
                                <span>{formatTime(duration)}</span>
                            </div>
                        </div>

                        {/* Transport Controls */}
                        <div className="flex items-center justify-between px-2">
                            <button onClick={toggleRepeatMode} className={`p-2 transition ${repeatMode === 'all' ? 'text-white' : repeatMode === 'one' ? 'text-[#9b82d4]' : 'text-white/40'}`}>
                                {repeatMode === 'one' ? (
                                    <svg className="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4zm-4-2V9h-1l-2 1v1h1.5v4H13z"/></svg>
                                ) : repeatMode === 'shuffle' ? (
                                    <svg className="w-6 h-6 fill-current text-[#9b82d4]" viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
                                ) : (
                                    <svg className="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
                                )}
                            </button>
                            
                            <div className="flex items-center gap-6">
                                <button onClick={handlePrev} className="text-white/80 hover:text-white transition p-2 active:scale-90">
                                    <svg className="w-10 h-10 fill-current" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                                </button>
                                
                                <button onClick={togglePlay} className="w-20 h-20 bg-white text-black rounded-full flex items-center justify-center shadow-xl hover:scale-105 active:scale-95 transition-transform">
                                    {isPlaying ? (
                                        <svg className="w-8 h-8 fill-current" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                                    ) : (
                                        <svg className="w-8 h-8 fill-current ml-2" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                                    )}
                                </button>

                                <button onClick={handleNext} className="text-white/80 hover:text-white transition p-2 active:scale-90">
                                    <svg className="w-10 h-10 fill-current" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                                </button>
                            </div>

                            <button onClick={() => setShowLangModal(true)} className="p-2 text-white/60 hover:text-white transition">
                                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"/></svg>
                            </button>
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="max-w-md mx-auto h-full bg-black shadow-2xl relative">
                    {view === 'home' ? renderHomeView() : renderPlayerView()}

                    {/* Language Modal (Stays on top of everything) */}
                    {showLangModal && (
                        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/60 backdrop-blur-sm sm:p-4">
                            <div className="bg-white w-full max-w-md sm:rounded-3xl rounded-t-3xl p-6 shadow-2xl animate-[slideUp_0.3s_ease-out]">
                                <div className="flex justify-between items-center mb-6">
                                    <h3 className="text-xl font-bold text-slate-900">언어 선택 (Language)</h3>
                                    <button onClick={() => setShowLangModal(false)} className="p-2 bg-slate-100 rounded-full text-slate-500 hover:text-slate-800">
                                        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/></svg>
                                    </button>
                                </div>
                                <div className="space-y-3">
                                    {[
                                        { code: 'ko', label: '한국어', native: 'Korean' },
                                        { code: 'en', label: 'English', native: '영어' },
                                        { code: 'cn', label: '中文', native: '중국어' }
                                    ].map((item) => (
                                        <button
                                            key={item.code}
                                            onClick={() => { setLang(item.code); setShowLangModal(false); }}
                                            className={`w-full py-4 px-5 rounded-2xl flex items-center justify-between transition border-2 ${
                                                lang === item.code 
                                                    ? 'border-[#4c3b6b] bg-purple-50 text-[#4c3b6b]' 
                                                    : 'border-transparent bg-slate-50 text-slate-700 hover:bg-slate-100'
                                            }`}
                                        >
                                            <div className="flex flex-col items-start">
                                                <span className="text-base font-bold">{item.label}</span>
                                                <span className="text-xs opacity-70">{item.native}</span>
                                            </div>
                                            {lang === item.code && (
                                                <svg className="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"/></svg>
                                            )}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Hidden Global Audio Tag (Preserves play state across views and languages) */}
                    <audio 
                        ref={audioRef} 
                        src={currentSong ? (currentSong.audio_urls[lang] || currentSong.audio_urls['ko']) : ''} 
                        preload="metadata" 
                    />
                    
                    <style dangerouslySetInnerHTML={{__html: `
                        .mask-image-vertical {
                            -webkit-mask-image: linear-gradient(to bottom, transparent, black 10%, black 80%, transparent);
                            mask-image: linear-gradient(to bottom, transparent, black 10%, black 80%, transparent);
                        }
                        @keyframes slideUp {
                            from { transform: translateY(100%); }
                            to { transform: translateY(0); }
                        }
                    `}} />
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
