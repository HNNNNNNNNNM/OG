<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>JW SONGBOOK</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
  :root{
    --purple: #5b4b93;
    --purple-dark: #453a72;
    --purple-tint: #f1eef8;
    --nav-bg: #efeff2;
    --bg: #ffffff;
    --ink: #1c1c1e;
    --gray: #8e8e93;
    --gray-light: #c7c7cc;
    --hairline: rgba(0,0,0,0.09);
    --danger: #b5452f;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html{ height:100%; overflow:hidden; }
  body{
    height:100%; width:100%; overflow:hidden; overscroll-behavior:none;
    position:fixed; inset:0;
  }
  body{
    margin:0;
    background: #d9d9dc;
    color: var(--ink);
    font-family: 'Pretendard Variable', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button{ font-family: inherit; }

  .app{
    max-width: clamp(480px, 85vw, 860px);
    margin: 0 auto;
    height: 100%;
    height: 100dvh;
    background: var(--bg);
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 40px rgba(0,0,0,0.25);
  }

  .screen{
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    background: var(--bg);
    transform: translateX(0);
    transition: transform 0.32s cubic-bezier(.32,.72,0,1);
    will-change: transform;
    z-index: 1;
    overflow: hidden;
  }
  .screen.offscreen-right{ transform: translateX(100%); z-index: 2; }
  .screen.offscreen-left{ transform: translateX(-28%); z-index: 0; }
  .screen.hidden{ display:none; }

  /* ---------- List header (image1 style) ---------- */
  .listheader{
    flex-shrink:0;
    background: var(--nav-bg);
    border-bottom: 1px solid var(--hairline);
    padding-top: env(safe-area-inset-top);
  }
  .listheader-row{
    display:flex; align-items:center;
    padding: 10px 8px;
    min-height: 44px;
  }
  .text-btn{
    background:none; border:none; color: var(--purple);
    font-size: 16px; font-weight:500;
    display:flex; align-items:center; gap:2px;
    padding: 6px 6px;
    cursor:pointer;
    flex-shrink:0;
    width: 74px;
  }
  .text-btn.invisible{ visibility:hidden; pointer-events:none; }
  .text-btn svg{ width:20px; height:20px; }
  .listheader-title{ flex:1; text-align:center; min-width:0; }
  .lh-title{
    font-size: 17px; font-weight:700; color: var(--ink);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .lh-sub{ font-size: 12.5px; color: var(--gray); margin-top:1px; }
  .listheader-icons{
    display:flex; align-items:center; gap:6px;
    min-width: 74px; justify-content:flex-end; flex-shrink:0;
  }
  .icon-btn{
    background:none; border:none; color: var(--purple);
    width:36px; height:36px; border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .icon-btn:hover{ background: rgba(91,75,147,0.08); }
  .icon-btn svg{ width:20px; height:20px; }
  .icon-btn.active{ color: var(--bg); background: var(--purple); }

  .lang-btn-row{ display:flex; gap:8px; justify-content:center; padding: 0 16px 12px; }
  .lang-btn-row .lang-pill{ font-size: 13px; padding: 7px 18px; font-weight:700; }

  .playbar-row{
    display:flex; gap:12px;
    padding: 4px 16px 16px;
  }
  .playbar-btn{
    flex:1;
    display:flex; align-items:center; justify-content:center; gap:8px;
    background: var(--bg);
    border: 1.5px solid var(--purple);
    color: var(--purple);
    border-radius: 8px;
    padding: 11px 8px;
    font-size: 15px; font-weight:600;
    cursor:pointer;
  }
  .playbar-btn:active{ background: var(--purple-tint); }
  .playbar-btn svg{ width:17px; height:17px; }
  .playbar-btn:disabled{ opacity:0.35; cursor:not-allowed; }

  /* ---------- Category list (image3 style) ---------- */
  .category-list{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .cat-row{
    display:flex; align-items:center; gap:14px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--hairline);
    cursor:pointer;
  }
  .cat-row:active{ background: var(--purple-tint); }
  .cat-thumb{
    width:56px; height:56px; border-radius:6px; object-fit:cover; flex-shrink:0;
    background: var(--nav-bg);
  }
  .cat-thumb.placeholder{ display:flex; align-items:center; justify-content:center; color:var(--gray-light); }
  .cat-name{ font-size:15.5px; font-weight:500; color: var(--ink); }
  .cat-count{ font-size:12.5px; color: var(--gray); margin-top:2px; }
  .cat-chevron{ margin-left:auto; color: var(--gray-light); flex-shrink:0; }
  .cat-chevron svg{ width:16px; height:16px; }

  /* ---------- Song rows (category detail) ---------- */
  .song-rows{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom: 12px; }
  .song-row{
    display:flex; align-items:center; gap:12px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--hairline);
    cursor:pointer;
  }
  .song-row:active{ background: var(--purple-tint); }
  .song-row.now-playing .song-row-title{ color: var(--purple); font-weight:700; }
  .song-num{
    width:22px; text-align:right; font-size:13px; color: var(--gray); flex-shrink:0;
    font-variant-numeric: tabular-nums;
  }
  .song-thumb{ width:40px; height:40px; border-radius:5px; object-fit:cover; flex-shrink:0; background:var(--nav-bg); }
  .song-row-title{ font-size:15px; color: var(--ink); flex:1; min-width:0; }
  .song-row-text{ flex:1; min-width:0; }
  .song-row-text .song-row-title{ display:block; }
  .song-row-sub{
    font-size:12px; color: var(--gray); margin-top:2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .fav-btn{
    background:none; border:none; color: var(--gray-light); flex-shrink:0;
    width:30px; height:30px; display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .fav-btn svg{ width:18px; height:18px; }
  .fav-btn.active{ color: var(--danger); }
  .fav-btn.active svg{ fill: currentColor; }
  .song-row-eq{ margin-left:auto; color: var(--purple); flex-shrink:0; }
  .song-row-eq svg{ width:16px; height:16px; }

  .empty-state{
    display:flex; align-items:center; justify-content:center;
    height:100%; color: var(--gray); font-size:14px; padding: 0 30px; text-align:center;
  }

  /* ---------- Player screen ---------- */
  .player-header{
    display:flex; align-items:center; gap:8px;
    padding: calc(10px + env(safe-area-inset-top)) 6px 10px;
    background: var(--nav-bg);
    border-bottom: 1px solid var(--hairline);
    flex-shrink:0;
    position:relative; z-index:1;
  }
  .player-header-title{ flex:1; text-align:center; min-width:0; }
  .ph-title{ font-size:15.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ph-sub{ font-size:12px; color: var(--gray); margin-top:1px; }
  #playerFavBtn.active{ color: var(--danger); }
  #playerFavBtn.active svg{ fill: currentColor; }

  .player-bg{
    position:absolute; inset:0; z-index:-1;
    background-size:cover; background-position:center;
    filter: blur(46px) brightness(0.6) saturate(1.25);
    transform: scale(1.18);
    transition: background-image 0.4s ease;
    clip-path: inset(0);
  }

  .player-toolbar{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding: 8px 16px; background: var(--nav-bg); border-bottom: 1px solid var(--hairline);
    flex-shrink:0; position:relative; z-index:1;
  }
  .next-up{ font-size:12px; color: var(--gray); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .font-size-ctrl{ display:flex; gap:6px; flex-shrink:0; }
  .font-size-ctrl button{
    background: var(--bg); border:1px solid var(--hairline); border-radius:7px;
    width:40px; height:28px; font-size:12px; font-weight:700; color: var(--ink); cursor:pointer;
    white-space:nowrap; padding:0; line-height:1;
  }

  .lyrics-scroll{
    flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding: 6vh 26px;
    background: rgba(255,255,255,0.93);
    position:relative; z-index:1;
  }
  .lyrics-inner{ min-height:100%; text-align:center; }
  .lyric-section-label{
    font-size: 13px; font-weight:700; letter-spacing:0.04em;
    color: var(--purple); text-transform:uppercase;
    margin: 22px 0 6px; opacity:0.75;
  }
  .lyric-section-label:first-child{ margin-top:0; }
  .lyric-line-item{
    font-size: calc(21px * var(--user-lyric-scale, 1));
    line-height: 1.9;
    font-weight: 600;
    color: var(--gray-light);
    transition: color 0.25s ease, font-weight 0.25s ease;
    cursor:pointer;
    padding: 3px 0;
  }
  .lyric-line-item.past{ color: var(--gray); }
  .lyric-line-item.active{
    color: var(--ink);
    font-weight: 800;
    font-size: calc(23px * var(--user-lyric-scale, 1));
  }
  .lyric-empty{
    color: var(--gray); font-size:14px; text-align:center; padding-top:40%;
  }

  .player-transport{
    flex-shrink:0;
    background: var(--nav-bg);
    border-top: 1px solid var(--hairline);
    padding: 10px 20px calc(14px + env(safe-area-inset-bottom));
  }
  .seek-row{ display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .time{ font-size:11px; color: var(--gray); min-width:32px; font-variant-numeric: tabular-nums; }
  .time.right{ text-align:right; }
  .seek{
    -webkit-appearance:none; appearance:none; flex:1; height:3px; border-radius:3px;
    background: var(--gray-light); outline:none; cursor:pointer;
  }
  .seek::-webkit-slider-thumb{
    -webkit-appearance:none; width:13px; height:13px; border-radius:50%;
    background: var(--purple); margin-top:-5px;
  }
  .seek::-moz-range-thumb{ width:13px; height:13px; border-radius:50%; border:none; background: var(--purple); }

  .lang-row{ display:flex; gap:8px; justify-content:center; margin-bottom: 10px; }
  .lang-pill{
    font-size: 11.5px; font-weight:600; letter-spacing:0.02em;
    padding: 5px 12px; border-radius:999px; border:1px solid var(--hairline);
    background: var(--bg); color: var(--gray); cursor:pointer;
  }
  .lang-pill.active{ background: var(--purple); border-color: var(--purple); color:#fff; }
  .lang-pill:disabled{ opacity:0.3; cursor:not-allowed; }

  .controls-row{
    display:flex; align-items:center; justify-content:space-between;
  }
  .ctrl-btn{
    background:none; border:none; color: var(--ink); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    width:40px; height:40px; position:relative;
  }
  .ctrl-btn svg{ width:22px; height:22px; }
  .ctrl-btn.mode-btn{ color: var(--gray); width:34px; height:34px; }
  .ctrl-btn.mode-btn svg{ width:19px; height:19px; }
  .ctrl-btn.mode-btn.active{ color: var(--purple); }
  .ctrl-btn.mode-btn .badge{
    position:absolute; top:2px; right:2px;
    font-size:9px; font-weight:800; color: var(--purple);
    background: var(--bg); border-radius:50%; width:12px; height:12px;
    display:flex; align-items:center; justify-content:center; line-height:1;
  }
  .ctrl-btn.play-pause{
    width:54px; height:54px; border-radius:50%;
    background: var(--purple); color:#fff;
  }
  .ctrl-btn.play-pause svg{ width:24px; height:24px; }
  .ctrl-btn.play-pause:active{ background: var(--purple-dark); }
  .ctrl-btn.big{ width:44px; height:44px; }
  .ctrl-btn.big svg{ width:24px; height:24px; }

  /* ---------- Mini player ---------- */
  .miniplayer{
    position:absolute; left:0; right:0; bottom:0;
    display:flex; align-items:center; gap:6px;
    padding: 8px 14px calc(8px + env(safe-area-inset-bottom));
    background: var(--nav-bg);
    border-top: 1px solid var(--hairline);
    cursor:pointer;
    z-index: 8;
  }
  .miniplayer.hidden{ display:none; }
  .mini-cover{ width:36px; height:36px; border-radius:5px; object-fit:cover; background:var(--bg); flex-shrink:0; }
  .mini-info{ flex:1; min-width:0; }
  .mini-title{ font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mini-progress{ height:2px; background: var(--gray-light); border-radius:2px; margin-top:5px; overflow:hidden; }
  .mini-progress-fill{ height:100%; background: var(--purple); width:0%; }
  .mini-btn{
    background:none; border:none; color: var(--purple); flex-shrink:0;
    width:30px; height:30px; display:flex; align-items:center; justify-content:center;
  }
  .mini-btn svg{ width:19px; height:19px; }
  .mini-btn-play{ width:34px; height:34px; }
  .mini-btn-play svg{ width:24px; height:24px; }

  /* ---------- Language popover ---------- */
  .popover-backdrop{ position:absolute; inset:0; z-index:9; display:none; }
  .popover-backdrop.open{ display:block; }
  .lang-popover{
    position:absolute; top: 54px; right: 10px;
    background: var(--bg);
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.22);
    border: 1px solid var(--hairline);
    overflow:hidden;
    min-width: 140px;
    z-index: 10;
  }
  .lang-popover button{
    display:flex; align-items:center; justify-content:space-between;
    width:100%; padding: 11px 16px; background:none; border:none;
    font-size:14.5px; color: var(--ink); cursor:pointer;
    border-bottom: 1px solid var(--hairline);
  }
  .lang-popover button:last-child{ border-bottom:none; }
  .lang-popover button:disabled{ color: var(--gray-light); cursor:not-allowed; }
  .lang-popover button.active{ color: var(--purple); font-weight:700; }

  /* ---------- Search overlay ---------- */
  .search-overlay{
    position:absolute; inset:0; background: var(--bg);
    display:flex; flex-direction:column;
    z-index: 12;
    transform: translateY(100%);
    transition: transform 0.28s ease;
  }
  .search-overlay.open{ transform: translateY(0); }
  .search-head{
    display:flex; align-items:center; gap:10px;
    padding: calc(12px + env(safe-area-inset-top)) 14px 10px;
    background: var(--nav-bg); border-bottom:1px solid var(--hairline);
    flex-shrink:0;
  }
  .search-input{
    flex:1; border:1px solid var(--hairline); background:var(--bg);
    border-radius: 9px; padding: 9px 12px; font-size:15px; color: var(--ink);
  }
  .search-cancel{ background:none; border:none; color: var(--purple); font-size:15px; cursor:pointer; padding:6px; }
  .search-results{ flex:1; overflow-y:auto; }

  .toast{
    position:absolute; top: calc(10px + env(safe-area-inset-top)); left:50%;
    transform: translate(-50%, -10px);
    background: var(--danger); color:#fff; font-size:13px;
    padding: 9px 16px; border-radius: 8px;
    opacity:0; pointer-events:none; transition: all 0.25s ease;
    z-index: 20; white-space:nowrap;
  }
  .toast.show{ opacity:1; transform: translate(-50%, 0); }

  .loading-screen{
    position:fixed; inset:0; background:#fff;
    display:flex; align-items:center; justify-content:center;
    color: var(--gray); font-size:14px; z-index:30;
  }
  .loading-screen.hidden{ display:none; }

  ::-webkit-scrollbar{ width:0; }

  @media (min-width: 600px){
    .lyric-line-item{ font-size: calc(26px * var(--user-lyric-scale, 1)); line-height: 2; }
    .lyric-line-item.active{ font-size: calc(29px * var(--user-lyric-scale, 1)); }
    .lh-title{ font-size: 20px; }
    .lh-sub{ font-size: 14px; }
    .ph-title{ font-size: 18px; }
    .ph-sub{ font-size: 13.5px; }
    .cat-name{ font-size: 18px; }
    .cat-count{ font-size: 14px; }
    .cat-thumb{ width:66px; height:66px; }
    .song-row-title{ font-size: 17px; }
    .song-thumb{ width:46px; height:46px; }
    .playbar-btn{ font-size: 17px; padding: 13px 8px; }
    .ctrl-btn.play-pause{ width:64px; height:64px; }
    .ctrl-btn.play-pause svg{ width:28px; height:28px; }
    .ctrl-btn.big{ width:50px; height:50px; }
    .ctrl-btn.big svg{ width:28px; height:28px; }
    .lang-pill{ font-size: 13.5px; padding: 7px 15px; }
    .lang-select-btn{ font-size: 14px; padding: 7px 12px; }
    .mini-title{ font-size: 15.5px; }
    .search-input{ font-size: 17px; }
  }
  @media (min-width: 900px){
    .lyric-line-item{ font-size: calc(30px * var(--user-lyric-scale, 1)); line-height: 2.05; }
    .lyric-line-item.active{ font-size: calc(34px * var(--user-lyric-scale, 1)); }
    .lh-title{ font-size: 22px; }
    .ph-title{ font-size: 20px; }
    .cat-name{ font-size: 19.5px; }
    .song-row-title{ font-size: 18px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
  }
</style>
</head>
<body>

<div class="loading-screen" id="loadingScreen">불러오는 중…</div>

<div class="app" id="app">

  <!-- ===== Library screen ===== -->
  <section class="screen" id="screenLibrary">
    <header class="listheader">
      <div class="listheader-row">
        <button class="icon-btn" id="libSearchBtn" aria-label="검색" title="검색">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
        <div class="listheader-title">
          <div class="lh-title">전체 곡</div>
          <div class="lh-sub" id="libLangSub">한국어</div>
        </div>
        <div class="listheader-icons"></div>
      </div>
      <div class="lang-btn-row" id="libLangRow"></div>
      <div class="playbar-row">
        <button class="playbar-btn" id="libPlayAllBtn">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>전체 재생
        </button>
        <button class="playbar-btn" id="libShuffleBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>임의 재생
        </button>
      </div>
    </header>
    <div class="category-list" id="categoryList"></div>
  </section>

  <!-- ===== Category screen ===== -->
  <section class="screen offscreen-right" id="screenCategory">
    <header class="listheader">
      <div class="listheader-row">
        <button class="text-btn" id="catBackBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>뒤로
        </button>
        <div class="listheader-title">
          <div class="lh-title" id="catTitle">카테고리</div>
          <div class="lh-sub" id="catLangSub">한국어</div>
        </div>
        <div class="listheader-icons">
          <button class="icon-btn" id="catSearchBtn" aria-label="검색" title="검색">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </button>
        </div>
      </div>
      <div class="lang-btn-row" id="catLangRow"></div>
      <div class="playbar-row">
        <button class="playbar-btn" id="catPlayAllBtn">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>전체 재생
        </button>
        <button class="playbar-btn" id="catShuffleBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>임의 재생
        </button>
      </div>
    </header>
    <div class="song-rows" id="categorySongList"></div>
  </section>

  <!-- ===== Player screen ===== -->
  <section class="screen offscreen-right" id="screenPlayer">
    <div class="player-bg" id="playerBg"></div>
    <header class="player-header">
      <button class="icon-btn" id="playerBackBtn" aria-label="뒤로">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="player-header-title">
        <div class="ph-title" id="playerTitle">—</div>
        <div class="ph-sub" id="playerSub"></div>
      </div>
      <button class="icon-btn" id="playerFavBtn" aria-label="즐겨찾기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
      </button>
    </header>
    <div class="player-toolbar">
      <div class="next-up" id="nextUpLabel"></div>
      <div class="font-size-ctrl">
        <button id="fontDecBtn" aria-label="글자 작게">가-</button>
        <button id="fontIncBtn" aria-label="글자 크게">가+</button>
      </div>
    </div>

    <div class="lyrics-scroll" id="lyricsScroll">
      <div class="lyrics-inner" id="lyricsInner"></div>
    </div>

    <div class="player-transport">
      <div class="seek-row">
        <span class="time" id="curTime">0:00</span>
        <input type="range" class="seek" id="seek" min="0" max="100" value="0" step="0.1" aria-label="재생 위치">
        <span class="time right" id="durTime">0:00</span>
      </div>
      <div class="lang-row" id="playerLangRow"></div>
      <div class="controls-row">
        <button class="ctrl-btn mode-btn" id="shuffleBtn" aria-label="임의 재생">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
        </button>
        <button class="ctrl-btn big" id="prevBtn" aria-label="이전 곡">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM20 6L9 12l11 6z"/></svg>
        </button>
        <button class="ctrl-btn play-pause" id="playBtn" aria-label="재생">
          <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
        </button>
        <button class="ctrl-btn big" id="nextBtn" aria-label="다음 곡">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM4 6l11 6-11 6z"/></svg>
        </button>
        <button class="ctrl-btn mode-btn" id="repeatBtn" aria-label="반복">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
          <span class="badge" id="repeatBadge" style="display:none">1</span>
        </button>
      </div>
    </div>
  </section>

  <!-- Mini player -->
  <div class="miniplayer hidden" id="miniPlayer">
    <img class="mini-cover" id="miniCover" alt="">
    <div class="mini-info">
      <div class="mini-title" id="miniTitle">—</div>
      <div class="mini-progress"><div class="mini-progress-fill" id="miniProgressFill"></div></div>
    </div>
    <button class="mini-btn" id="miniPrevBtn" aria-label="이전 곡">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM20 6L9 12l11 6z"/></svg>
    </button>
    <button class="mini-btn mini-btn-play" id="miniPlayBtn" aria-label="재생/일시정지">
      <svg id="miniPlayIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      <svg id="miniPauseIcon" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
    </button>
    <button class="mini-btn" id="miniNextBtn" aria-label="다음 곡">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM4 6l11 6-11 6z"/></svg>
    </button>
  </div>

  <!-- Search overlay -->
  <div class="search-overlay" id="searchOverlay">
    <div class="search-head">
      <input type="text" class="search-input" id="searchInput" placeholder="제목으로 찾기">
      <button class="search-cancel" id="searchCancelBtn">취소</button>
    </div>
    <div class="search-results" id="searchResults"></div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<audio id="audio" preload="metadata"></audio>

<script>
(function(){
  "use strict";

  const LANG_LABELS = { ko: '한국어', en: 'English', cn: '中文' };
  const SHORT_LANG_LABEL = { ko: 'KO', en: 'EN', cn: '中文' };
  const SYNTHETIC_LABELS = {
    favorites: { ko: '즐겨찾기', en: 'Favorites', cn: '收藏' },
    recent: { ko: '최근 재생', en: 'Recently Played', cn: '最近播放' }
  };
  const LANG_ORDER = ['ko','en','cn'];
  const CATEGORY_LABELS = {
    ko: {
      VODOriginalSongs: '오리지널 송',
      VODCjOriginalSongs: '어린이 오리지널 송',
      SJJChorus: "'기쁨으로 여호와께 노래하라'—노래",
      VODSJJMeetings: "'기쁨으로 여호와께 노래하라'—집회"
    },
    en: {
      VODOriginalSongs: 'Original Songs',
      VODCjOriginalSongs: "Children's Original Songs",
      SJJChorus: "'Sing Out Joyfully to Jehovah'—Songs",
      VODSJJMeetings: "'Sing Out Joyfully to Jehovah'—Meetings"
    },
    cn: {
      VODOriginalSongs: '原创歌曲',
      VODCjOriginalSongs: '儿童原创歌曲',
      SJJChorus: '《向耶和华欢然歌唱》—歌曲',
      VODSJJMeetings: '《向耶和华欢然歌唱》—聚会'
    }
  };

  const $ = (id) => document.getElementById(id);
  const els = {
    loading: $('loadingScreen'),
    screenLibrary: $('screenLibrary'),
    screenCategory: $('screenCategory'),
    screenPlayer: $('screenPlayer'),
    categoryList: $('categoryList'),
    categorySongList: $('categorySongList'),
    catTitle: $('catTitle'),
    catLangSub: $('catLangSub'),
    libLangSub: $('libLangSub'),
    catBackBtn: $('catBackBtn'),
    libPlayAllBtn: $('libPlayAllBtn'),
    libShuffleBtn: $('libShuffleBtn'),
    catPlayAllBtn: $('catPlayAllBtn'),
    catShuffleBtn: $('catShuffleBtn'),
    playerBackBtn: $('playerBackBtn'),
    playerTitle: $('playerTitle'),
    playerSub: $('playerSub'),
    playerLangRow: $('playerLangRow'),
    lyricsScroll: $('lyricsScroll'),
    lyricsInner: $('lyricsInner'),
    curTime: $('curTime'),
    durTime: $('durTime'),
    seek: $('seek'),
    playBtn: $('playBtn'),
    playIcon: $('playIcon'),
    pauseIcon: $('pauseIcon'),
    prevBtn: $('prevBtn'),
    nextBtn: $('nextBtn'),
    shuffleBtn: $('shuffleBtn'),
    repeatBtn: $('repeatBtn'),
    repeatBadge: $('repeatBadge'),
    miniPlayer: $('miniPlayer'),
    miniCover: $('miniCover'),
    miniTitle: $('miniTitle'),
    miniProgressFill: $('miniProgressFill'),
    miniPrevBtn: $('miniPrevBtn'),
    miniPlayBtn: $('miniPlayBtn'),
    miniNextBtn: $('miniNextBtn'),
    playerBg: $('playerBg'),
    playerFavBtn: $('playerFavBtn'),
    nextUpLabel: $('nextUpLabel'),
    miniPlayIcon: $('miniPlayIcon'),
    miniPauseIcon: $('miniPauseIcon'),
    libSearchBtn: $('libSearchBtn'),
    catSearchBtn: $('catSearchBtn'),
    searchOverlay: $('searchOverlay'),
    searchInput: $('searchInput'),
    searchResults: $('searchResults'),
    searchCancelBtn: $('searchCancelBtn'),
    toast: $('toast'),
    audio: $('audio'),
  };

  let songs = [];              // all songs, as loaded
  let categories = [];         // [{key, label, thumb, indices:[...]}]
  let currentLang = 'ko';

  // navigation stack: array of {name, data}
  let navStack = [{ name: 'library' }];

  // playback state
  let activePlaylist = [];     // array of global song indices, in "natural" order
  let playOrder = [];          // array of global song indices, in play order (shuffled or not)
  let playPos = -1;            // index into playOrder
  let shuffleOn = false;
  let repeatMode = 'off';      // off | all | one
  let lyricLineEls = [];
  let lastActiveLyricIdx = -1;
  let seeking = false;

  function fmtTime(t){
    if (!isFinite(t) || t < 0) t = 0;
    const m = Math.floor(t / 60);
    const s = Math.floor(t % 60);
    return m + ':' + String(s).padStart(2, '0');
  }

  function showToast(msg){
    els.toast.textContent = msg;
    els.toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => els.toast.classList.remove('show'), 2600);
  }

  function categoryLabel(key, lang){
    lang = lang || currentLang;
    const table = CATEGORY_LABELS[lang] || {};
    return table[key] || CATEGORY_LABELS.ko[key] || key;
  }

  function songTitle(song, lang){
    lang = lang || currentLang;
    const t = song.title;
    if (typeof t === 'string') return t;
    if (!t) return '(제목 없음)';
    return t[lang] || t.ko || t.en || t.cn || '(제목 없음)';
  }
  function songNumber(song){
    const raw = songTitle(song, 'ko') || songTitle(song, 'en') || songTitle(song, 'cn') || '';
    const m = String(raw).match(/^(\d+)[.．]/);
    return m ? parseInt(m[1], 10) : null;
  }
  function hasLang(song, lang){ return !!(song.audio_urls && song.audio_urls[lang]); }

  // ---------------- 즐겨찾기 ----------------
  const FAV_KEY = 'jw_song_favorites';
  function loadFavorites(){
    try { return new Set(JSON.parse(localStorage.getItem(FAV_KEY) || '[]')); }
    catch(e){ return new Set(); }
  }
  function saveFavorites(set){
    try { localStorage.setItem(FAV_KEY, JSON.stringify(Array.from(set))); } catch(e){}
  }
  let favoriteKeys = loadFavorites();
  function isFavorite(song){ return favoriteKeys.has(song.natural_key); }
  function toggleFavorite(song){
    if (favoriteKeys.has(song.natural_key)) favoriteKeys.delete(song.natural_key);
    else favoriteKeys.add(song.natural_key);
    saveFavorites(favoriteKeys);
    buildCategories();
    refreshCurrentScreen();
  }

  // ---------------- 최근 재생 ----------------
  const RECENT_KEY = 'jw_recently_played';
  const RECENT_MAX = 30;
  function loadRecents(){
    try { return JSON.parse(localStorage.getItem(RECENT_KEY) || '[]'); }
    catch(e){ return []; }
  }
  function saveRecents(list){
    try { localStorage.setItem(RECENT_KEY, JSON.stringify(list)); } catch(e){}
  }
  let recentKeys = loadRecents(); // natural_key 배열, 최신이 앞
  function recordRecent(song){
    recentKeys = recentKeys.filter(k => k !== song.natural_key);
    recentKeys.unshift(song.natural_key);
    if (recentKeys.length > RECENT_MAX) recentKeys = recentKeys.slice(0, RECENT_MAX);
    saveRecents(recentKeys);
  }
  function sectionLabelText(raw){
    if (raw === '후렴'){
      return currentLang === 'en' ? 'Chorus' : (currentLang === 'cn' ? '副歌' : '후렴');
    }
    const n = raw.replace(/[.．]$/, '');
    if (currentLang === 'en') return 'Verse ' + n;
    if (currentLang === 'cn') return '第' + n + '段';
    return n + '절';
  }

  function shuffleArray(arr){
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function pickPlayableLang(song, preferred){
    if (song.audio_urls && song.audio_urls[preferred]) return preferred;
    for (const l of LANG_ORDER) if (song.audio_urls && song.audio_urls[l]) return l;
    return null;
  }

  // ---------------- Navigation ----------------
  const SCREEN_ORDER = { library: 0, category: 1, player: 2 };
  let currentScreenName = 'library';

  function showScreen(name){
    if (name === currentScreenName){
      els.miniPlayer.classList.toggle('hidden', name === 'player' || playPos < 0);
      return;
    }
    const forward = (SCREEN_ORDER[name] ?? 0) > (SCREEN_ORDER[currentScreenName] ?? 0);
    const screenEls = { library: els.screenLibrary, category: els.screenCategory, player: els.screenPlayer };
    const incoming = screenEls[name];
    const outgoing = screenEls[currentScreenName];

    if (forward){
      incoming.classList.add('offscreen-right');
      void incoming.offsetWidth; // 강제 리플로우로 시작 위치 확정 후 애니메이션
      incoming.classList.remove('offscreen-right');
      if (outgoing) outgoing.classList.add('offscreen-left');
    } else {
      incoming.classList.remove('offscreen-left'); // 전에 파킹돼있던 자리(-28%)에서 중앙으로
      if (outgoing) outgoing.classList.add('offscreen-right');
    }

    currentScreenName = name;
    els.miniPlayer.classList.toggle('hidden', name === 'player' || playPos < 0);
  }

  function navigateTo(name, data){
    navStack.push({ name, data });
    showScreen(name);
    if (name === 'category') renderCategoryScreen(data.key);
  }

  function goBack(){
    if (navStack.length <= 1){ showScreen('library'); return; }
    navStack.pop();
    const top = navStack[navStack.length - 1];
    showScreen(top.name);
    if (top.name === 'category') renderCategoryScreen(top.data.key);
  }

  els.catBackBtn.addEventListener('click', goBack);
  els.playerBackBtn.addEventListener('click', goBack);

  // ---------------- Library screen ----------------
  function buildCategories(){
    const map = new Map();
    songs.forEach((song, idx) => {
      if (!hasLang(song, currentLang)) return; // 선택된 언어로 재생 가능한 곡만
      const key = song.category || '기타';
      if (!map.has(key)) map.set(key, { key, label: categoryLabel(key), thumb: song.cover_url || '', indices: [] });
      const c = map.get(key);
      c.indices.push(idx);
      if (!c.thumb && song.cover_url) c.thumb = song.cover_url;
    });
    categories = Array.from(map.values());
    categories.forEach(cat => {
      if (cat.key === 'VODOriginalSongs') return; // 오리지널송은 기존 순서(최신순) 유지
      cat.indices.sort((a, b) => {
        const na = songNumber(songs[a]), nb = songNumber(songs[b]);
        if (na === null && nb === null) return 0;
        if (na === null) return 1;
        if (nb === null) return -1;
        return na - nb;
      });
    });

    // natural_key -> global index (현재 언어로 재생 가능한 곡 중에서만)
    const byKey = new Map();
    songs.forEach((song, idx) => { if (hasLang(song, currentLang)) byKey.set(song.natural_key, idx); });

    const recentIndices = recentKeys.map(k => byKey.get(k)).filter(i => i !== undefined);
    const favIndices = Array.from(favoriteKeys).map(k => byKey.get(k)).filter(i => i !== undefined);

    const synthetic = [];
    if (favIndices.length){
      synthetic.push({ key: '__favorites__', label: SYNTHETIC_LABELS.favorites[currentLang] || SYNTHETIC_LABELS.favorites.ko, thumb: songs[favIndices[0]].cover_url || '', indices: favIndices });
    }
    if (recentIndices.length){
      synthetic.push({ key: '__recent__', label: SYNTHETIC_LABELS.recent[currentLang] || SYNTHETIC_LABELS.recent.ko, thumb: songs[recentIndices[0]].cover_url || '', indices: recentIndices });
    }
    categories = synthetic.concat(categories);
  }

  function renderLibraryScreen(){
    els.libLangSub.textContent = LANG_LABELS[currentLang];
    buildLangRow($('libLangRow'));
    els.categoryList.innerHTML = '';
    if (!categories.length){
      els.categoryList.innerHTML = '<div class="empty-state">아직 곡이 없어요.</div>';
      return;
    }
    categories.forEach(cat => {
      const row = document.createElement('div');
      row.className = 'cat-row';
      row.innerHTML =
        '<img class="cat-thumb" src="' + (cat.thumb || '') + '" alt="" loading="lazy">' +
        '<div><div class="cat-name"></div><div class="cat-count"></div></div>' +
        '<div class="cat-chevron"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></div>';
      row.querySelector('.cat-name').textContent = cat.label;
      row.querySelector('.cat-count').textContent = cat.indices.length + '곡';
      row.addEventListener('click', () => navigateTo('category', { key: cat.key }));
      els.categoryList.appendChild(row);
    });
  }

  els.libPlayAllBtn.addEventListener('click', () => startPlaylist(allIndices(), false));
  els.libShuffleBtn.addEventListener('click', () => startPlaylist(allIndices(), true));

  function allIndices(){
    const out = [];
    songs.forEach((s, i) => { if (hasLang(s, currentLang)) out.push(i); });
    return out;
  }

  // ---------------- Category screen ----------------
  function renderCategoryScreen(key){
    const cat = categories.find(c => c.key === key);
    if (!cat) { goBack(); return; }
    els.catTitle.textContent = cat.label;
    els.catLangSub.textContent = LANG_LABELS[currentLang];
    buildLangRow($('catLangRow'));
    els.catPlayAllBtn.onclick = () => startPlaylist(cat.indices, false);
    els.catShuffleBtn.onclick = () => startPlaylist(cat.indices, true);

    els.categorySongList.innerHTML = '';
    cat.indices.forEach((globalIdx, i) => {
      const song = songs[globalIdx];
      const row = document.createElement('div');
      row.className = 'song-row';
      row.dataset.globalIdx = globalIdx;
      row.innerHTML =
        '<span class="song-num">' + (i + 1) + '</span>' +
        '<img class="song-thumb" src="' + (song.cover_url || '') + '" alt="" loading="lazy">' +
        '<span class="song-row-title"></span>' +
        '<button class="fav-btn" aria-label="즐겨찾기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg></button>';
      row.querySelector('.song-row-title').textContent = songTitle(song);
      const favBtn = row.querySelector('.fav-btn');
      favBtn.classList.toggle('active', isFavorite(song));
      favBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleFavorite(song); });
      row.addEventListener('click', () => startPlaylist(cat.indices, false, globalIdx));
      els.categorySongList.appendChild(row);
    });
    highlightNowPlayingRows();
  }

  function highlightNowPlayingRows(){
    const curGlobal = playPos >= 0 ? playOrder[playPos] : -1;
    Array.from(els.categorySongList.children).forEach(row => {
      row.classList.toggle('now-playing', parseInt(row.dataset.globalIdx, 10) === curGlobal);
    });
  }

  // ---------------- Playback engine ----------------
  function startPlaylist(indices, shuffle, startGlobalIdx){
    if (!indices.length){ showToast('재생할 곡이 없어요.'); return; }
    activePlaylist = indices.slice();
    shuffleOn = shuffle;
    playOrder = shuffleOn ? shuffleArray(activePlaylist) : activePlaylist.slice();

    if (startGlobalIdx !== undefined){
      const at = playOrder.indexOf(startGlobalIdx);
      playPos = at >= 0 ? at : 0;
    } else {
      playPos = 0;
    }
    updateModeButtons();
    loadAtPlayPos(true);
    navigateTo('player', {});
  }

  function loadAtPlayPos(autoplay){
    if (playPos < 0 || playPos >= playOrder.length) return;
    songFinishing = false;
    const globalIdx = playOrder[playPos];
    const song = songs[globalIdx];
    const lang = pickPlayableLang(song, currentLang);
    if (!lang){ showToast('이 곡은 재생할 수 있는 오디오가 없어요.'); return; }
    currentLang = lang;
    renderAllLangRows();

    els.playerTitle.textContent = songTitle(song);
    els.playerSub.textContent = LANG_LABELS[currentLang];
    els.miniTitle.textContent = songTitle(song);
    els.miniCover.src = song.cover_url || '';
    updateMediaSession(song);

    els.playerBg.style.backgroundImage = song.cover_url ? `url('${song.cover_url}')` : 'none';
    els.playerFavBtn.classList.toggle('active', isFavorite(song));
    els.playerFavBtn.onclick = () => {
      toggleFavorite(song);
      els.playerFavBtn.classList.toggle('active', isFavorite(song));
    };
    recordRecent(song);
    updateNextUpLabel();

    renderLangRow(song);
    buildLyricsView(song);

    els.audio.src = song.audio_urls[lang];
    if (autoplay) els.audio.play().catch(onPlayError);

    highlightNowPlayingRows();
  }

  function getNextSongPreview(){
    if (playPos < 0) return null;
    let p = playPos + 1;
    if (p >= playOrder.length){
      if (repeatMode === 'all') p = 0;
      else return null;
    }
    return songs[playOrder[p]];
  }
  function updateNextUpLabel(){
    if (!els.nextUpLabel) return;
    if (repeatMode === 'one'){
      els.nextUpLabel.textContent = currentLang === 'en' ? 'Repeating this song' : (currentLang === 'cn' ? '单曲循环中' : '이 곡 반복 재생 중');
      return;
    }
    const nxt = getNextSongPreview();
    if (!nxt){
      els.nextUpLabel.textContent = currentLang === 'en' ? 'Last song' : (currentLang === 'cn' ? '最后一首' : '마지막 곡이에요');
      return;
    }
    const prefix = currentLang === 'en' ? 'Next: ' : (currentLang === 'cn' ? '下一首：' : '다음 곡: ');
    els.nextUpLabel.textContent = prefix + songTitle(nxt);
  }

  function onPlayError(){ showToast('이 브라우저에서는 이 언어의 오디오를 재생할 수 없어요.'); }

  function updateMediaSession(song){
    if (!('mediaSession' in navigator)) return;
    const artwork = song.cover_url ? [
      { src: song.cover_url, sizes: '512x512', type: 'image/jpeg' }
    ] : [];
    navigator.mediaSession.metadata = new MediaMetadata({
      title: songTitle(song),
      artist: LANG_LABELS[currentLang],
      album: categoryLabel(song.category),
      artwork: artwork
    });
  }

  function setupMediaSessionHandlers(){
    if (!('mediaSession' in navigator)) return;
    navigator.mediaSession.setActionHandler('play', () => els.audio.play().catch(onPlayError));
    navigator.mediaSession.setActionHandler('pause', () => els.audio.pause());
    navigator.mediaSession.setActionHandler('previoustrack', () => prev());
    navigator.mediaSession.setActionHandler('nexttrack', () => next(false));
    navigator.mediaSession.setActionHandler('seekto', (details) => {
      if (details.seekTime !== undefined) els.audio.currentTime = details.seekTime;
    });
  }

  function togglePlay(){
    if (!els.audio.src) return;
    if (els.audio.paused) els.audio.play().catch(onPlayError);
    else els.audio.pause();
  }

  function next(auto){
    if (playPos < 0) return;
    if (repeatMode === 'one' && !auto){
      // manual "next" while repeat-one still advances to next track
    }
    let p = playPos + 1;
    if (p >= playOrder.length){
      if (repeatMode === 'all'){
        p = 0;
        if (shuffleOn) playOrder = shuffleArray(activePlaylist);
      } else {
        els.audio.pause();
        return;
      }
    }
    playPos = p;
    loadAtPlayPos(true);
  }

  function prev(){
    if (playPos < 0) return;
    if (els.audio.currentTime > 3){ els.audio.currentTime = 0; return; }
    let p = playPos - 1;
    if (p < 0){
      if (repeatMode === 'all') p = playOrder.length - 1;
      else p = 0;
    }
    playPos = p;
    loadAtPlayPos(true);
  }

  function toggleShuffle(){
    shuffleOn = !shuffleOn;
    const curGlobal = playOrder[playPos];
    if (shuffleOn){
      const rest = activePlaylist.filter(i => i !== curGlobal);
      playOrder = [curGlobal, ...shuffleArray(rest)];
      playPos = 0;
    } else {
      playOrder = activePlaylist.slice();
      playPos = playOrder.indexOf(curGlobal);
    }
    updateModeButtons();
  }

  function cycleRepeat(){
    repeatMode = repeatMode === 'off' ? 'all' : (repeatMode === 'all' ? 'one' : 'off');
    updateModeButtons();
  }

  function updateModeButtons(){
    els.shuffleBtn.classList.toggle('active', shuffleOn);
    els.repeatBtn.classList.toggle('active', repeatMode !== 'off');
    els.repeatBadge.style.display = repeatMode === 'one' ? 'flex' : 'none';
    updateNextUpLabel();
  }

  // ---------------- 가사 글씨 크기 ----------------
  const FONT_SCALE_KEY = 'jw_lyric_scale';
  const FONT_SCALE_MIN = 0.8, FONT_SCALE_MAX = 1.6, FONT_SCALE_STEP = 0.1;
  let lyricScale = parseFloat(localStorage.getItem(FONT_SCALE_KEY)) || 1;
  function applyLyricScale(){
    document.documentElement.style.setProperty('--user-lyric-scale', lyricScale);
  }
  function setLyricScale(v){
    lyricScale = Math.max(FONT_SCALE_MIN, Math.min(FONT_SCALE_MAX, Math.round(v * 10) / 10));
    try { localStorage.setItem(FONT_SCALE_KEY, lyricScale); } catch(e){}
    applyLyricScale();
  }
  applyLyricScale();
  $('fontDecBtn').addEventListener('click', () => setLyricScale(lyricScale - FONT_SCALE_STEP));
  $('fontIncBtn').addEventListener('click', () => setLyricScale(lyricScale + FONT_SCALE_STEP));

  els.playBtn.addEventListener('click', togglePlay);
  els.miniPlayBtn.addEventListener('click', (e) => { e.stopPropagation(); togglePlay(); });
  els.miniPrevBtn.addEventListener('click', (e) => { e.stopPropagation(); prev(); });
  els.miniNextBtn.addEventListener('click', (e) => { e.stopPropagation(); next(false); });
  els.prevBtn.addEventListener('click', () => prev());
  els.nextBtn.addEventListener('click', () => next(false));
  els.shuffleBtn.addEventListener('click', toggleShuffle);
  els.repeatBtn.addEventListener('click', cycleRepeat);

  els.miniPlayer.addEventListener('click', () => { if (playPos >= 0) navigateTo('player', {}); });

  // ---- 화면 자동 꺼짐 방지 (재생 중 + 사이트가 보이는 동안만; 백그라운드 가면 자동 해제되어 기기 설정 따라감) ----
  let wakeLock = null;
  async function acquireWakeLock(){
    if (!('wakeLock' in navigator)) return;
    if (wakeLock) return;
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } catch (e) {
      wakeLock = null;
    }
  }
  function releaseWakeLock(){
    if (wakeLock){ wakeLock.release().catch(() => {}); wakeLock = null; }
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && els.audio && !els.audio.paused){
      acquireWakeLock();
    }
  });

  els.audio.addEventListener('play', () => {
    els.playIcon.style.display = 'none'; els.pauseIcon.style.display = '';
    els.miniPlayIcon.style.display = 'none'; els.miniPauseIcon.style.display = '';
    acquireWakeLock();
  });
  els.audio.addEventListener('pause', () => {
    els.playIcon.style.display = ''; els.pauseIcon.style.display = 'none';
    els.miniPlayIcon.style.display = ''; els.miniPauseIcon.style.display = 'none';
    releaseWakeLock();
  });
  let songFinishing = false;

  function handleSongFinished(){
    if (songFinishing) return;
    songFinishing = true;
    if (repeatMode === 'one'){
      els.audio.currentTime = 0;
      els.audio.play().catch(onPlayError);
    } else {
      next(true);
    }
    setTimeout(() => { songFinishing = false; }, 800);
  }

  els.audio.addEventListener('ended', handleSongFinished);
  els.audio.addEventListener('error', () => {
    onPlayError();
    // 재생 자체가 깨진 곡이면 몇 초 뒤 자동으로 다음 곡으로 넘어감 (무한정 멈춰있지 않도록)
    setTimeout(() => { if (els.audio.error) handleSongFinished(); }, 2500);
  });
  els.audio.addEventListener('loadedmetadata', () => {
    els.durTime.textContent = fmtTime(els.audio.duration);
    els.seek.max = els.audio.duration || 100;
  });
  els.audio.addEventListener('timeupdate', () => {
    if (!seeking){
      els.curTime.textContent = fmtTime(els.audio.currentTime);
      els.seek.value = els.audio.currentTime;
    }
    const pct = els.audio.duration ? (els.audio.currentTime / els.audio.duration) * 100 : 0;
    els.miniProgressFill.style.width = pct + '%';
    updateLyricHighlight(els.audio.currentTime);
    // 일부 스트림에서 'ended' 이벤트가 안 뜨는 경우를 대비한 안전장치
    if (els.audio.duration && !seeking && els.audio.currentTime >= els.audio.duration - 0.3){
      handleSongFinished();
    }
  });
  els.seek.addEventListener('input', () => { seeking = true; els.curTime.textContent = fmtTime(els.seek.value); });
  els.seek.addEventListener('change', () => { els.audio.currentTime = parseFloat(els.seek.value); seeking = false; });

  // ---------------- Language switching (keeps position) ----------------
  function renderLangRow(song){
    els.playerLangRow.innerHTML = '';
    LANG_ORDER.forEach(l => {
      const has = !!(song.audio_urls && song.audio_urls[l]);
      const btn = document.createElement('button');
      btn.className = 'lang-pill' + (l === currentLang ? ' active' : '');
      btn.textContent = LANG_LABELS[l] === 'English' ? 'EN' : (LANG_LABELS[l] === '中文' ? '中文' : 'KO');
      btn.disabled = !has;
      btn.addEventListener('click', () => switchLang(l));
      els.playerLangRow.appendChild(btn);
    });
  }

  function switchLang(lang){
    if (lang === currentLang) return;
    if (playPos < 0) { currentLang = lang; return; }
    const song = songs[playOrder[playPos]];
    if (!song.audio_urls || !song.audio_urls[lang]){ showToast('이 언어의 오디오가 없어요.'); return; }
    const savedTime = els.audio.currentTime;
    const wasPlaying = !els.audio.paused;
    currentLang = lang;
    renderAllLangRows();
    els.playerTitle.textContent = songTitle(song);
    els.playerSub.textContent = LANG_LABELS[currentLang];
    els.miniTitle.textContent = songTitle(song);
    renderLangRow(song);
    buildLyricsView(song);
    updateMediaSession(song);

    const onReady = () => {
      els.audio.currentTime = savedTime;
      if (wasPlaying) els.audio.play().catch(onPlayError);
      els.audio.removeEventListener('loadedmetadata', onReady);
    };
    els.audio.addEventListener('loadedmetadata', onReady);
    els.audio.src = song.audio_urls[lang];
  }

  // ---------------- Full lyrics view ----------------
  function buildLyricsView(song){
    const lines = (song.scripts && song.scripts[currentLang]) || [];
    els.lyricsInner.innerHTML = '';
    lyricLineEls = [];
    lastActiveLyricIdx = -1;
    if (!lines.length){
      els.lyricsInner.innerHTML = '<div class="lyric-empty">이 언어에는 가사 자막이 없어요.</div>';
      return;
    }
    let lastSection = null;
    lines.forEach((line, idx) => {
      if (line.section && line.section !== lastSection){
        const label = document.createElement('div');
        label.className = 'lyric-section-label';
        label.textContent = sectionLabelText(line.section);
        els.lyricsInner.appendChild(label);
      }
      lastSection = line.section || null;
      const div = document.createElement('div');
      div.className = 'lyric-line-item';
      div.textContent = line.text;
      div.addEventListener('click', () => { els.audio.currentTime = line.start; });
      els.lyricsInner.appendChild(div);
      lyricLineEls.push({ el: div, start: line.start, end: line.end });
    });
  }

  function updateLyricHighlight(t){
    if (!lyricLineEls.length) return;
    let idx = -1;
    for (let i = 0; i < lyricLineEls.length; i++){
      if (t >= lyricLineEls[i].start && t < lyricLineEls[i].end){ idx = i; break; }
      if (t < lyricLineEls[i].start) { idx = i - 1; break; }
    }
    if (idx === lastActiveLyricIdx) return;
    lastActiveLyricIdx = idx;
    lyricLineEls.forEach((item, i) => {
      item.el.classList.toggle('active', i === idx);
      item.el.classList.toggle('past', i < idx);
    });
    if (idx >= 0){
      const container = els.lyricsScroll;
      const target = lyricLineEls[idx].el;
      const targetCenter = target.offsetTop + target.clientHeight / 2;
      let top = targetCenter - container.clientHeight / 2;
      const maxTop = Math.max(0, container.scrollHeight - container.clientHeight);
      top = Math.max(0, Math.min(top, maxTop));
      container.scrollTo({ top, behavior: 'smooth' });
    }
  }

  // ---------------- Language button rows (always-visible 3 buttons) ----------------
  function buildLangRow(container){
    if (!container) return;
    container.innerHTML = '';
    LANG_ORDER.forEach(l => {
      const btn = document.createElement('button');
      btn.className = 'lang-pill' + (l === currentLang ? ' active' : '');
      btn.textContent = SHORT_LANG_LABEL[l];
      btn.addEventListener('click', () => selectLanguage(l));
      container.appendChild(btn);
    });
  }

  function renderAllLangRows(){
    buildLangRow($('libLangRow'));
    buildLangRow($('catLangRow'));
  }

  function refreshCurrentScreen(){
    const top = navStack[navStack.length - 1];
    if (top.name === 'library') {
      renderLibraryScreen();
    } else if (top.name === 'category') {
      els.catLangSub.textContent = LANG_LABELS[currentLang];
      const stillExists = categories.some(c => c.key === top.data.key);
      if (stillExists) {
        renderCategoryScreen(top.data.key);
      } else {
        showToast('목록이 비어서 이전 화면으로 돌아가요.');
        goBack();
      }
    }
  }

  function selectLanguage(l){
    if (l === currentLang) return;
    const song = playPos >= 0 ? songs[playOrder[playPos]] : null;
    if (song) {
      switchLang(l);
    } else {
      currentLang = l;
    }
    els.libLangSub.textContent = LANG_LABELS[currentLang];
    buildCategories();
    renderAllLangRows();
    refreshCurrentScreen();
  }

  // ---------------- Search ----------------
  function openSearch(){
    els.searchOverlay.classList.add('open');
    els.searchInput.value = '';
    renderSearchResults('');
    setTimeout(() => els.searchInput.focus(), 250);
  }
  function closeSearch(){ els.searchOverlay.classList.remove('open'); }
  function songLyricsMatch(song, query){
    const lines = (song.scripts && song.scripts[currentLang]) || [];
    for (const l of lines){
      if (l.text && l.text.toLowerCase().includes(query)) return l.text;
    }
    return null;
  }

  function renderSearchResults(q){
    const query = q.trim().toLowerCase();
    els.searchResults.innerHTML = '';
    songs.forEach((song, idx) => {
      if (!hasLang(song, currentLang)) return;
      const title = songTitle(song);
      let snippet = null;
      if (query){
        const titleMatch = title.toLowerCase().includes(query);
        if (!titleMatch){
          snippet = songLyricsMatch(song, query);
          if (!snippet) return;
        }
      }
      const row = document.createElement('div');
      row.className = 'song-row';
      row.innerHTML =
        '<img class="song-thumb" src="' + (song.cover_url || '') + '" alt="" loading="lazy">' +
        '<div class="song-row-text"><span class="song-row-title"></span></div>';
      const titleEl = row.querySelector('.song-row-title');
      titleEl.textContent = title;
      if (snippet){
        const sub = document.createElement('div');
        sub.className = 'song-row-sub';
        sub.textContent = snippet;
        row.querySelector('.song-row-text').appendChild(sub);
      }
      row.addEventListener('click', () => {
        closeSearch();
        startPlaylist(allIndices(), false, idx);
      });
      els.searchResults.appendChild(row);
    });
    if (!els.searchResults.children.length){
      els.searchResults.innerHTML = '<div class="empty-state">검색 결과가 없어요.</div>';
    }
  }
  els.libSearchBtn.addEventListener('click', openSearch);
  els.catSearchBtn.addEventListener('click', openSearch);
  els.searchCancelBtn.addEventListener('click', closeSearch);
  els.searchInput.addEventListener('input', () => renderSearchResults(els.searchInput.value));

  // ---------------- Boot ----------------
  fetch('./songs.json')
    .then(r => { if (!r.ok) throw new Error('fetch failed: ' + r.status); return r.json(); })
    .then(data => {
      const list = Array.isArray(data) ? data : (data && Array.isArray(data.songs) ? data.songs : []);
      songs = list.filter(s => s.audio_urls && Object.keys(s.audio_urls).length);
      buildCategories();
      renderAllLangRows();
      els.loading.classList.add('hidden');
      renderLibraryScreen();
      showScreen('library');
      setupMediaSessionHandlers();
    })
    .catch(err => {
      els.loading.textContent = '곡 목록을 불러오지 못했어요. songs.json 파일 위치를 확인해 주세요.';
      console.error(err);
    });

})();
</script>
</body>
</html>
