<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>노래 — 라이브러리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
  :root{
    --purple: #5b4a91;
    --purple-dim: rgba(91,74,145,0.12);
    --purple-line: rgba(91,74,145,0.55);
    --header-bg: #ececec;
    --bg: #ffffff;
    --panel: #f7f7f8;
    --line: #e3e3e6;
    --text: #1c1c1e;
    --text-soft: #6e6e73;
    --text-dim: #a8a8ad;
    --danger: #c0392b;
    --radius: 10px;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Pretendard Variable', 'Pretendard', -apple-system, 'Noto Sans SC', sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  .app{
    max-width: 480px;
    margin: 0 auto;
    height: 100dvh;
    position: relative;
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
    background: var(--bg);
  }

  .screen{
    position:absolute; inset:0;
    display:none;
    flex-direction:column;
    background: var(--bg);
  }
  .screen.active{ display:flex; }

  ::-webkit-scrollbar{ width:6px; }
  ::-webkit-scrollbar-thumb{ background: var(--line); border-radius:3px; }

  button{ font-family: inherit; }

  /* ---------- Shared: page header (image 1 style) ---------- */
  .page-header{
    background: var(--header-bg);
    flex-shrink:0;
    padding: 16px 16px 14px;
    display:flex; align-items:center; gap:10px;
  }
  .back-btn{
    display:flex; align-items:center; gap:2px;
    background:none; border:none; color: var(--purple);
    font-size: 16px; font-weight:500; cursor:pointer;
    padding: 6px 2px 6px 0; flex-shrink:0;
  }
  .back-btn svg{ width:20px; height:20px; }
  .header-titles{
    flex:1; text-align:center; min-width:0;
  }
  .header-titles .h-title{
    font-size: 17px; font-weight:600;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .header-titles .h-sub{
    font-size: 13px; color: var(--text-soft); margin-top:1px;
  }
  .header-actions{ display:flex; align-items:center; gap:6px; flex-shrink:0; }
  .header-icon-btn{
    width:34px; height:34px; border-radius:8px;
    border: 1.5px solid var(--purple-line);
    background: none; color: var(--purple);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:12px; font-weight:700;
  }
  .header-icon-btn svg{ width:18px; height:18px; }
  .header-icon-btn.plain{ border-color: transparent; color: var(--text-soft); }

  .lang-popover{
    display:none;
    padding: 8px 16px 0;
    gap:8px;
    background: var(--header-bg);
    flex-wrap:wrap;
  }
  .lang-popover.open{ display:flex; }
  .lang-chip{
    font-family:'Space Mono', monospace;
    font-size: 12px; letter-spacing:0.04em;
    padding: 7px 14px; border-radius: 999px;
    border: 1.5px solid var(--purple-line);
    background: var(--bg); color: var(--purple);
    cursor:pointer;
  }
  .lang-chip.active{ background: var(--purple); color:#fff; border-color:var(--purple); }
  .lang-chip:disabled{ opacity:0.3; cursor:not-allowed; }

  /* ---------- Play bar (image 1's two buttons) ---------- */
  .playbar-row{
    display:flex; gap:12px;
    padding: 16px 16px 8px;
    flex-shrink:0;
  }
  .playbar-btn{
    flex:1;
    display:flex; align-items:center; justify-content:center; gap:8px;
    border: 1.5px solid var(--purple-line);
    border-radius: var(--radius);
    background: var(--bg);
    color: var(--purple);
    font-size: 15px; font-weight:500;
    padding: 13px 10px;
    cursor:pointer;
  }
  .playbar-btn svg{ width:19px; height:19px; }
  .playbar-btn:active{ background: var(--purple-dim); }

  /* ---------- Library screen ---------- */
  .category-list{ overflow-y:auto; flex:1; padding: 6px 8px 20px; }
  .category-row, .song-row{
    display:flex; align-items:center; gap:13px;
    padding: 10px 10px;
    border-radius: var(--radius);
    cursor:pointer;
  }
  .category-row:hover, .song-row:hover{ background: var(--panel); }
  .category-row.playing .row-title, .song-row.playing .row-title{ color: var(--purple); }
  .row-thumb{
    width:46px; height:46px; border-radius:8px; object-fit:cover; flex-shrink:0;
    background: var(--panel); border: 1px solid var(--line);
  }
  .row-num{
    width:46px; text-align:center; flex-shrink:0;
    font-family:'Space Mono', monospace; color: var(--text-dim); font-size:13px;
  }
  .row-title{
    font-size: 15px; font-weight:500;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .row-sub{
    font-family:'Space Mono', monospace; font-size: 11px; color: var(--text-dim); margin-top:2px;
  }
  .row-texts{ min-width:0; flex:1; }
  .empty-hint{
    padding: 40px 24px; text-align:center; color: var(--text-dim); font-size:14px; line-height:1.6;
  }

  /* ---------- Category screen ---------- */
  #screenCategory .category-list{ padding-top: 2px; }

  /* ---------- Player screen ---------- */
  #screenPlayer .page-header{ background: var(--header-bg); }
  .stage{
    flex:1;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: 0 30px; text-align:center; position:relative; min-height:0;
  }
  .lyric-line{
    font-weight:600; line-height:1.55;
    transition: opacity 0.35s ease, transform 0.35s ease, filter 0.35s ease;
    word-break: keep-all;
  }
  .lyric-line.prev, .lyric-line.next{
    font-size: clamp(14px, 3.6vw, 18px);
    color: var(--text-dim); filter: blur(0.3px); opacity: 0.7;
  }
  .lyric-line.prev{ transform: translateY(-4px); margin-bottom: 22px; }
  .lyric-line.next{ transform: translateY(4px); margin-top: 22px; }
  .lyric-line.current{
    font-size: clamp(20px, 5.6vw, 27px);
    color: var(--purple);
  }
  .lyric-idle{
    font-family:'Fraunces', serif; font-style: italic;
    font-size: 16px; color: var(--text-dim); letter-spacing: 0.02em;
  }
  .lyric-idle .dots span{ animation: blink 1.4s infinite; animation-delay: calc(var(--i) * 0.2s); }
  @keyframes blink{ 0%,100%{opacity:.25;} 50%{opacity:1;} }

  .notice{
    text-align:center; font-size: 12px; color: var(--danger);
    height: 16px; padding-top: 4px; opacity: 0; transition: opacity 0.2s ease; flex-shrink:0;
  }
  .notice.show{ opacity: 1; }

  .transport{ flex-shrink:0; padding: 6px 22px calc(16px + env(safe-area-inset-bottom)); }
  .seek-row{ display:flex; align-items:center; gap:10px; margin-bottom: 12px; }
  .time{ font-family:'Space Mono', monospace; font-size: 11px; color: var(--text-soft); min-width: 34px; }
  .time.right{ text-align:right; }
  .seek{
    -webkit-appearance:none; appearance:none; flex:1; height: 3px; border-radius: 3px;
    background: var(--line); outline:none; cursor:pointer;
  }
  .seek::-webkit-slider-thumb{
    -webkit-appearance:none; width:12px; height:12px; border-radius:50%;
    background: var(--purple); box-shadow: 0 0 0 3px var(--purple-dim); margin-top: -4.5px;
  }
  .seek::-webkit-slider-runnable-track{ height:3px; border-radius:3px; }
  .seek::-moz-range-thumb{ width:12px; height:12px; border-radius:50%; border:none; background: var(--purple); }

  .controls{ display:flex; align-items:center; justify-content:space-between; gap: 6px; }
  .ctrl-btn{
    background:none; border:none; color: var(--text); cursor:pointer;
    display:flex; align-items:center; justify-content:center; position:relative;
  }
  .ctrl-btn svg{ width:20px; height:20px; }
  .ctrl-btn.side{ color: var(--text-soft); width:40px; height:40px; }
  .ctrl-btn.side.active{ color: var(--purple); }
  .ctrl-btn.side .badge{
    position:absolute; bottom:2px; right:2px;
    font-family:'Space Mono', monospace; font-size:9px; font-weight:700;
    background: var(--purple); color:#fff; border-radius:50%;
    width:12px; height:12px; display:flex; align-items:center; justify-content:center;
  }
  .ctrl-btn.nav{ width:34px; height:34px; }
  .ctrl-btn.nav svg{ width:24px; height:24px; }
  .ctrl-btn.play-pause{
    width:58px; height:58px; border-radius:50%;
    background: var(--purple); color:#fff;
    transition: transform 0.12s ease;
  }
  .ctrl-btn.play-pause:active{ transform: scale(0.94); }
  .ctrl-btn.play-pause svg{ width:24px; height:24px; }

  /* ---------- Song-list drawer (used inside player) ---------- */
  .drawer-backdrop{
    position:absolute; inset:0; background: rgba(20,20,24,0.35);
    opacity:0; pointer-events:none; transition: opacity 0.25s ease; z-index: 5;
  }
  .drawer-backdrop.open{ opacity:1; pointer-events:auto; }
  .drawer{
    position:absolute; left:0; right:0; bottom:0; height: 72%;
    background: var(--bg); border-top: 1px solid var(--line);
    border-radius: 18px 18px 0 0; transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(.32,.72,0,1); z-index: 6;
    display:flex; flex-direction:column; box-shadow: 0 -12px 30px rgba(0,0,0,0.15);
  }
  .drawer.open{ transform: translateY(0); }
  .drawer-handle{ width:36px; height:4px; border-radius:2px; background: var(--line); margin: 12px auto 6px; flex-shrink:0; }
  .drawer-head{ display:flex; align-items:center; justify-content:space-between; padding: 4px 20px 12px; flex-shrink:0; }
  .drawer-head h2{ font-family:'Fraunces', serif; font-weight:600; font-size: 17px; margin:0; }
  .drawer-count{ font-family:'Space Mono', monospace; font-size:11px; color:var(--text-soft); }
  .search-box{
    margin: 0 20px 10px; padding: 9px 12px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; color: var(--text); font-size: 14px;
  }
  .search-box::placeholder{ color: var(--text-dim); }
  .drawer .category-list{ padding: 0 8px 14px; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  .loading-screen{
    position:fixed; inset:0; background:var(--bg);
    display:flex; align-items:center; justify-content:center;
    color:var(--text-dim); font-family:'Fraunces',serif; font-style:italic; z-index:20;
  }
  .loading-screen.hidden{ display:none; }
</style>
</head>
<body>

<div class="loading-screen" id="loadingScreen">불러오는 중…</div>

<div class="app">

  <!-- ============ Screen 1: Library (image 3) ============ -->
  <div class="screen active" id="screenLibrary">
    <div class="page-header">
      <div class="header-titles">
        <div class="h-title">라이브러리</div>
        <div class="h-sub" id="libSub">한국어</div>
      </div>
      <div class="header-actions">
        <button class="header-icon-btn" id="libLangBtn" title="언어 선택">Aa</button>
      </div>
    </div>
    <div class="lang-popover" id="libLangPopover"></div>
    <div class="playbar-row">
      <button class="playbar-btn" id="libPlayAllBtn">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        전체 재생
      </button>
      <button class="playbar-btn" id="libShuffleBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
        임의 재생
      </button>
    </div>
    <div class="category-list" id="categoryList"></div>
  </div>

  <!-- ============ Screen 2: Category detail (image 1) ============ -->
  <div class="screen" id="screenCategory">
    <div class="page-header">
      <button class="back-btn" id="catBackBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        뒤로
      </button>
      <div class="header-titles">
        <div class="h-title" id="catTitle">오리지널송</div>
        <div class="h-sub" id="catSub">한국어</div>
      </div>
      <div class="header-actions">
        <button class="header-icon-btn" id="catLangBtn" title="언어 선택">Aa</button>
        <button class="header-icon-btn plain" id="catSortBtn" title="최신순 정렬">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg>
        </button>
      </div>
    </div>
    <div class="lang-popover" id="catLangPopover"></div>
    <div class="playbar-row">
      <button class="playbar-btn" id="catPlayAllBtn">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        전체 재생
      </button>
      <button class="playbar-btn" id="catShuffleBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
        임의 재생
      </button>
    </div>
    <div class="category-list" id="catSongRows"></div>
  </div>

  <!-- ============ Screen 3: Player (image 2) ============ -->
  <div class="screen" id="screenPlayer">
    <div class="page-header">
      <button class="back-btn" id="playerBackBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        뒤로
      </button>
      <div class="header-titles">
        <div class="h-title" id="trackTitle">—</div>
        <div class="h-sub" id="trackSub">오리지널송</div>
      </div>
      <div class="header-actions">
        <button class="header-icon-btn" id="playerLangBtn" title="언어 선택">Aa</button>
        <button class="header-icon-btn plain" id="openDrawerBtn" title="곡 목록">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="14" y2="17"/></svg>
        </button>
      </div>
    </div>
    <div class="lang-popover" id="playerLangPopover"></div>

    <div class="stage" id="stage">
      <div class="lyric-idle" id="lyricIdle">
        연주 중<span class="dots"><span style="--i:0">.</span><span style="--i:1">.</span><span style="--i:2">.</span></span>
      </div>
    </div>

    <div class="notice" id="notice"></div>

    <div class="transport">
      <div class="seek-row">
        <span class="time" id="curTime">0:00</span>
        <input type="range" class="seek" id="seek" min="0" max="100" value="0" step="0.1" aria-label="재생 위치">
        <span class="time right" id="durTime">0:00</span>
      </div>
      <div class="controls">
        <button class="ctrl-btn side" id="shuffleBtn" aria-label="임의 재생" title="임의 재생">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
        </button>
        <button class="ctrl-btn nav" id="prevBtn" aria-label="이전 곡">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM20 6L9 12l11 6z"/></svg>
        </button>
        <button class="ctrl-btn play-pause" id="playBtn" aria-label="재생">
          <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
        </button>
        <button class="ctrl-btn nav" id="nextBtn" aria-label="다음 곡">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM4 6l11 6-11 6z"/></svg>
        </button>
        <button class="ctrl-btn side" id="repeatBtn" aria-label="반복" title="반복">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
          <span class="badge" id="repeatBadge" style="display:none">1</span>
        </button>
      </div>
    </div>

    <div class="drawer-backdrop" id="drawerBackdrop"></div>
    <div class="drawer" id="drawer">
      <div class="drawer-handle"></div>
      <div class="drawer-head">
        <h2 id="drawerTitle">재생목록</h2>
        <span class="drawer-count" id="drawerCount">0곡</span>
      </div>
      <input type="text" class="search-box" id="searchBox" placeholder="제목으로 찾기">
      <div class="category-list" id="songList"></div>
    </div>
  </div>

</div>

<audio id="audio" preload="metadata"></audio>

<script>
(function(){
  "use strict";

  const LANG_LABELS = { ko: '한국어', en: 'English', cn: '中文' };
  const LANG_SHORT  = { ko: 'KO', en: 'EN', cn: '中文' };
  const LANG_ORDER  = ['ko','en','cn'];
  // 카테고리 코드 -> 표시 이름. 앞으로 스크랩한 데이터에 새 category 값이 생기면
  // 여기에 한 줄만 추가하면 라이브러리 화면에 새 그룹으로 나타납니다.
  const CATEGORY_LABELS = {
    VODOriginalSongs: '오리지널송',
  };

  const els = {};
  ['loadingScreen','categoryList','catSongRows','catTitle','catSub','catLangBtn','catLangPopover',
   'catSortBtn','catBackBtn','catPlayAllBtn','catShuffleBtn',
   'libSub','libLangBtn','libLangPopover','libPlayAllBtn','libShuffleBtn',
   'stage','lyricIdle','notice','curTime','durTime','seek','playBtn','playIcon','pauseIcon',
   'prevBtn','nextBtn','shuffleBtn','repeatBtn','repeatBadge','openDrawerBtn','drawer','drawerBackdrop',
   'drawerTitle','drawerCount','searchBox','songList','audio','trackTitle','trackSub',
   'playerLangBtn','playerLangPopover','playerBackBtn'
  ].forEach(id => els[id] = document.getElementById(id));

  let songs = [];               // 전체 곡 배열 (songs.json)
  let currentLang = 'ko';       // 현재(선호) 언어
  let activeCategory = null;    // 현재 열려 있는 카테고리 화면의 정보
  let cameFrom = 'screenLibrary'; // 플레이어 화면에서 뒤로가기 시 돌아갈 화면

  // 재생 큐 상태
  let scope = [];        // songs 배열의 인덱스 목록 (현재 재생 범위: 카테고리 전체 or 전체 라이브러리)
  let queueOrder = [];   // scope 내 위치의 순열 (셔플 시 뒤섞임)
  let pointer = -1;      // queueOrder 상의 현재 위치
  let currentSongIndex = -1;
  let shuffleEnabled = false;
  let repeatMode = 'off'; // 'off' | 'all' | 'one'

  let seeking = false;
  let renderedLineKey = null;
  let pendingLoadedMetaHandler = null;

  // ---------- Utils ----------
  function fmtTime(t){
    if (!isFinite(t) || t < 0) t = 0;
    const m = Math.floor(t / 60);
    const s = Math.floor(t % 60);
    return m + ':' + String(s).padStart(2, '0');
  }
  function shuffleArray(arr){
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function pickLang(song, preferred){
    if (song.audio_urls && song.audio_urls[preferred]) return preferred;
    for (const l of LANG_ORDER) if (song.audio_urls && song.audio_urls[l]) return l;
    return null;
  }
  function categoryLabel(song){
    return CATEGORY_LABELS[song.category] || song.category_label || song.category || '기타';
  }
  function showNotice(msg){
    els.notice.textContent = msg;
    els.notice.classList.add('show');
    clearTimeout(showNotice._t);
    showNotice._t = setTimeout(() => els.notice.classList.remove('show'), 3200);
  }
  function showScreen(id){
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  // ---------- Language popovers ----------
  function buildLangPopover(container, song, onPick){
    container.innerHTML = '';
    LANG_ORDER.forEach(l => {
      const has = song ? !!(song.audio_urls && song.audio_urls[l]) : true;
      const btn = document.createElement('button');
      btn.className = 'lang-chip' + (l === currentLang ? ' active' : '');
      btn.textContent = LANG_SHORT[l];
      btn.disabled = !has;
      btn.addEventListener('click', () => { container.classList.remove('open'); onPick(l); });
      container.appendChild(btn);
    });
  }
  function toggleLangPopover(container, song, onPick){
    if (container.classList.contains('open')){ container.classList.remove('open'); return; }
    document.querySelectorAll('.lang-popover').forEach(p => p.classList.remove('open'));
    buildLangPopover(container, song, onPick);
    container.classList.add('open');
  }
  els.libLangBtn.addEventListener('click', () => {
    toggleLangPopover(els.libLangPopover, null, (l) => { currentLang = l; refreshLangLabels(); });
  });
  els.catLangBtn.addEventListener('click', () => {
    toggleLangPopover(els.catLangPopover, null, (l) => { currentLang = l; refreshLangLabels(); renderCategorySongRows(); });
  });
  els.playerLangBtn.addEventListener('click', () => {
    toggleLangPopover(els.playerLangPopover, songs[currentSongIndex], switchLang);
  });
  function refreshLangLabels(){
    els.libSub.textContent = LANG_LABELS[currentLang];
    if (activeCategory) els.catSub.textContent = LANG_LABELS[currentLang] + ' · ' + activeCategory.indices.length + '곡';
  }

  // ---------- Library screen ----------
  function groupCategories(){
    const map = new Map();
    songs.forEach((song, i) => {
      const key = song.category || 'unknown';
      if (!map.has(key)) {
        map.set(key, { key, label: categoryLabel(song), cover: song.cover_url, indices: [] });
      }
      map.get(key).indices.push(i);
    });
    return Array.from(map.values());
  }

  function renderLibrary(){
    const cats = groupCategories();
    els.categoryList.innerHTML = '';
    if (!cats.length){
      els.categoryList.innerHTML = '<div class="empty-hint">아직 등록된 곡이 없어요.<br>songs.json을 확인해 주세요.</div>';
      return;
    }
    cats.forEach(cat => {
      const row = document.createElement('div');
      row.className = 'category-row';
      row.innerHTML =
        '<img class="row-thumb" src="' + (cat.cover || '') + '" alt="" loading="lazy">' +
        '<div class="row-texts"><div class="row-title"></div><div class="row-sub"></div></div>';
      row.querySelector('.row-title').textContent = cat.label;
      row.querySelector('.row-sub').textContent = cat.indices.length + '곡';
      row.addEventListener('click', () => openCategory(cat));
      els.categoryList.appendChild(row);
    });
  }

  els.libPlayAllBtn.addEventListener('click', () => {
    const all = songs.map((_, i) => i);
    if (!all.length) return;
    cameFrom = 'screenLibrary';
    startPlayback(all, 0, false);
  });
  els.libShuffleBtn.addEventListener('click', () => {
    const all = songs.map((_, i) => i);
    if (!all.length) return;
    cameFrom = 'screenLibrary';
    startPlayback(all, 0, true);
  });

  // ---------- Category screen ----------
  let catSortByDate = false;

  function openCategory(cat){
    activeCategory = cat;
    catSortByDate = false;
    els.catTitle.textContent = cat.label;
    refreshLangLabels();
    renderCategorySongRows();
    showScreen('screenCategory');
  }

  function renderCategorySongRows(){
    if (!activeCategory) return;
    let indices = activeCategory.indices.slice();
    if (catSortByDate){
      indices.sort((a, b) => new Date(songs[b].date || 0) - new Date(songs[a].date || 0));
    }
    els.catSongRows.innerHTML = '';
    indices.forEach((songIdx, pos) => {
      const song = songs[songIdx];
      const row = document.createElement('div');
      row.className = 'song-row' + (songIdx === currentSongIndex ? ' playing' : '');
      row.innerHTML =
        '<span class="row-num">' + (pos + 1) + '</span>' +
        '<div class="row-texts"><div class="row-title"></div><div class="row-sub"></div></div>';
      row.querySelector('.row-title').textContent = song.title || '제목 없음';
      row.querySelector('.row-sub').textContent =
        (song.audio_urls && Object.keys(song.audio_urls).map(l => LANG_SHORT[l]).join(' · ')) || '';
      row.addEventListener('click', () => {
        cameFrom = 'screenCategory';
        const scopeIndices = activeCategory.indices.slice();
        startPlayback(scopeIndices, scopeIndices.indexOf(songIdx), false);
      });
      els.catSongRows.appendChild(row);
    });
  }

  els.catBackBtn.addEventListener('click', () => showScreen('screenLibrary'));
  els.catSortBtn.addEventListener('click', () => {
    catSortByDate = !catSortByDate;
    els.catSortBtn.classList.toggle('active', catSortByDate);
    els.catSortBtn.title = catSortByDate ? '번호순 정렬' : '최신순 정렬';
    renderCategorySongRows();
  });
  els.catPlayAllBtn.addEventListener('click', () => {
    if (!activeCategory) return;
    cameFrom = 'screenCategory';
    startPlayback(activeCategory.indices.slice(), 0, false);
  });
  els.catShuffleBtn.addEventListener('click', () => {
    if (!activeCategory) return;
    cameFrom = 'screenCategory';
    startPlayback(activeCategory.indices.slice(), 0, true);
  });
  els.playerBackBtn.addEventListener('click', () => showScreen(cameFrom));

  // ---------- Playback queue ----------
  function startPlayback(scopeIndices, startPos, shuffle){
    scope = scopeIndices;
    shuffleEnabled = shuffle;
    if (shuffle){
      let order = shuffleArray(scope.map((_, i) => i));
      // 선택한 곡(있다면)을 맨 앞으로
      const at = order.indexOf(startPos);
      if (at > 0){ order.splice(at, 1); order.unshift(startPos); }
      queueOrder = order;
      pointer = 0;
    } else {
      queueOrder = scope.map((_, i) => i);
      pointer = startPos;
    }
    updateShuffleUI();
    playAtPointer(true);
  }

  function playAtPointer(autoplay){
    const scopePos = queueOrder[pointer];
    const songIndex = scope[scopePos];
    loadSong(songIndex, autoplay);
    showScreen('screenPlayer');
    renderCategorySongRows();
  }

  function loadSong(index, autoplay){
    currentSongIndex = index;
    const song = songs[currentSongIndex];
    const lang = pickLang(song, currentLang) || 'ko';
    currentLang = lang;

    els.trackTitle.textContent = song.title || '제목 없음';
    els.trackSub.textContent = categoryLabel(song);
    resetLyricStage();
    refreshLangLabels();

    if (song.audio_urls && song.audio_urls[lang]){
      els.audio.src = song.audio_urls[lang];
      if (autoplay) els.audio.play().catch(onPlayError);
    } else {
      showNotice('이 곡은 재생할 수 있는 오디오가 없어요.');
    }
  }

  function onPlayError(){
    showNotice('이 브라우저에서는 이 언어의 오디오를 재생할 수 없어요.');
  }
  function togglePlay(){
    if (els.audio.paused) els.audio.play().catch(onPlayError);
    else els.audio.pause();
  }

  function goNext(){
    if (!queueOrder.length) return;
    const wasPlaying = !els.audio.paused;
    pointer = (pointer + 1) % queueOrder.length;
    playAtPointer(wasPlaying);
  }
  function goPrev(){
    if (!queueOrder.length) return;
    const wasPlaying = !els.audio.paused;
    pointer = (pointer - 1 + queueOrder.length) % queueOrder.length;
    playAtPointer(wasPlaying);
  }

  els.audio.addEventListener('ended', () => {
    if (repeatMode === 'one'){
      els.audio.currentTime = 0;
      els.audio.play().catch(onPlayError);
      return;
    }
    const atEnd = pointer === queueOrder.length - 1;
    if (atEnd && repeatMode === 'off'){
      return; // 마지막 곡이고 반복이 꺼져 있으면 정지
    }
    pointer = (pointer + 1) % queueOrder.length;
    playAtPointer(true);
  });
  els.audio.addEventListener('error', onPlayError);
  els.audio.addEventListener('play', () => {
    els.playIcon.style.display = 'none';
    els.pauseIcon.style.display = '';
  });
  els.audio.addEventListener('pause', () => {
    els.playIcon.style.display = '';
    els.pauseIcon.style.display = 'none';
  });
  els.audio.addEventListener('loadedmetadata', () => {
    els.durTime.textContent = fmtTime(els.audio.duration);
    els.seek.max = els.audio.duration || 100;
  });
  els.audio.addEventListener('timeupdate', () => {
    if (!seeking){
      els.curTime.textContent = fmtTime(els.audio.currentTime);
      els.seek.value = els.audio.currentTime;
    }
    updateLyrics(els.audio.currentTime);
  });

  els.seek.addEventListener('input', () => { seeking = true; els.curTime.textContent = fmtTime(els.seek.value); });
  els.seek.addEventListener('change', () => { els.audio.currentTime = parseFloat(els.seek.value); seeking = false; });

  els.playBtn.addEventListener('click', togglePlay);
  els.prevBtn.addEventListener('click', goPrev);
  els.nextBtn.addEventListener('click', goNext);

  // ---------- Shuffle / Repeat controls ----------
  function updateShuffleUI(){
    els.shuffleBtn.classList.toggle('active', shuffleEnabled);
  }
  els.shuffleBtn.addEventListener('click', () => {
    if (!scope.length) return;
    const currentScopePos = queueOrder[pointer];
    shuffleEnabled = !shuffleEnabled;
    if (shuffleEnabled){
      const rest = queueOrder.filter((_, i) => i !== pointer);
      queueOrder = [currentScopePos, ...shuffleArray(rest)];
      pointer = 0;
    } else {
      queueOrder = scope.map((_, i) => i);
      pointer = currentScopePos;
    }
    updateShuffleUI();
  });

  function updateRepeatUI(){
    els.repeatBtn.classList.toggle('active', repeatMode !== 'off');
    els.repeatBadge.style.display = repeatMode === 'one' ? 'flex' : 'none';
    els.repeatBtn.title = repeatMode === 'off' ? '반복 꺼짐' : (repeatMode === 'all' ? '전체 반복' : '한 곡 반복');
  }
  els.repeatBtn.addEventListener('click', () => {
    repeatMode = repeatMode === 'off' ? 'all' : (repeatMode === 'all' ? 'one' : 'off');
    updateRepeatUI();
  });
  updateRepeatUI();

  // ---------- Language sync mid-song ----------
  function switchLang(lang){
    const song = songs[currentSongIndex];
    if (!song || !song.audio_urls || !song.audio_urls[lang]) return;
    if (lang === currentLang) return;

    const wasPlaying = !els.audio.paused;
    const t = els.audio.currentTime;
    const oldLines = (song.scripts && song.scripts[currentLang]) || [];
    let idx = -1;
    for (let i = 0; i < oldLines.length; i++){
      if (t >= oldLines[i].start && t < oldLines[i].end){ idx = i; break; }
      if (t < oldLines[i].start) break;
    }
    const oldDuration = els.audio.duration || 0;

    currentLang = lang;
    refreshLangLabels();
    els.trackSub.textContent = categoryLabel(song);

    const newLines = (song.scripts && song.scripts[lang]) || [];
    let seekTo = 0;
    if (idx >= 0 && newLines[idx]){
      seekTo = newLines[idx].start; // 같은 가사 줄의 시작 지점으로 이동 (동기화)
    } else if (oldDuration > 0){
      const ratio = t / oldDuration; // 줄 정보가 없으면 재생 비율로 근사
      seekTo = ratio; // 나중에 새 duration을 곱함
    }

    if (pendingLoadedMetaHandler) els.audio.removeEventListener('loadedmetadata', pendingLoadedMetaHandler);
    pendingLoadedMetaHandler = function(){
      let finalSeek = seekTo;
      if (!(idx >= 0 && newLines[idx])){
        finalSeek = seekTo * (els.audio.duration || 0);
      }
      els.audio.currentTime = finalSeek;
      if (wasPlaying) els.audio.play().catch(onPlayError);
      els.audio.removeEventListener('loadedmetadata', pendingLoadedMetaHandler);
      pendingLoadedMetaHandler = null;
    };
    els.audio.addEventListener('loadedmetadata', pendingLoadedMetaHandler);

    resetLyricStage();
    els.audio.src = song.audio_urls[lang];
    els.audio.load();
  }

  // ---------- Lyrics ----------
  function resetLyricStage(){
    renderedLineKey = null;
    els.lyricIdle.style.display = 'flex';
    Array.from(els.stage.querySelectorAll('.lyric-line')).forEach(n => n.remove());
  }

  function updateLyrics(t){
    const song = songs[currentSongIndex];
    if (!song) return;
    const lines = (song.scripts && song.scripts[currentLang]) || [];
    if (!lines.length){
      if (renderedLineKey !== 'idle'){ resetLyricStage(); renderedLineKey = 'idle'; }
      return;
    }
    let idx = -1;
    for (let i = 0; i < lines.length; i++){
      if (t >= lines[i].start && t < lines[i].end){ idx = i; break; }
      if (t < lines[i].start) break;
    }
    if (idx === renderedLineKey) return;
    renderedLineKey = idx;

    els.lyricIdle.style.display = 'none';
    Array.from(els.stage.querySelectorAll('.lyric-line')).forEach(n => n.remove());

    if (idx === -1){ els.lyricIdle.style.display = 'flex'; return; }

    const frag = document.createDocumentFragment();
    if (idx > 0){
      const p = document.createElement('div');
      p.className = 'lyric-line prev';
      p.textContent = lines[idx - 1].text;
      frag.appendChild(p);
    }
    const c = document.createElement('div');
    c.className = 'lyric-line current';
    c.textContent = lines[idx].text;
    frag.appendChild(c);
    if (idx < lines.length - 1){
      const n = document.createElement('div');
      n.className = 'lyric-line next';
      n.textContent = lines[idx + 1].text;
      frag.appendChild(n);
    }
    els.stage.appendChild(frag);
  }

  // ---------- Player drawer (queue list) ----------
  function openDrawer(){
    els.drawerTitle.textContent = activeCategory ? activeCategory.label : '전체 곡';
    renderDrawerList(els.searchBox.value);
    els.drawer.classList.add('open');
    els.drawerBackdrop.classList.add('open');
  }
  function closeDrawer(){
    els.drawer.classList.remove('open');
    els.drawerBackdrop.classList.remove('open');
  }
  els.openDrawerBtn.addEventListener('click', openDrawer);
  els.drawerBackdrop.addEventListener('click', closeDrawer);

  function renderDrawerList(filter){
    const f = (filter || '').trim().toLowerCase();
    const list = scope.length ? scope : songs.map((_, i) => i);
    els.songList.innerHTML = '';
    let shown = 0;
    list.forEach((songIdx) => {
      const song = songs[songIdx];
      if (f && !song.title.toLowerCase().includes(f)) return;
      shown++;
      const item = document.createElement('div');
      item.className = 'category-row' + (songIdx === currentSongIndex ? ' playing' : '');
      item.innerHTML =
        '<img class="row-thumb" src="' + (song.cover_url || '') + '" alt="" loading="lazy">' +
        '<div class="row-texts"><div class="row-title"></div><div class="row-sub"></div></div>';
      item.querySelector('.row-title').textContent = song.title;
      item.querySelector('.row-sub').textContent =
        (song.audio_urls && Object.keys(song.audio_urls).map(l => LANG_SHORT[l]).join(' · ')) || '';
      item.addEventListener('click', () => {
        const posInScope = scope.indexOf(songIdx);
        if (posInScope >= 0){
          pointer = queueOrder.indexOf(posInScope);
          if (pointer < 0) pointer = 0;
        }
        playAtPointer(true);
        closeDrawer();
      });
      els.songList.appendChild(item);
    });
    els.drawerCount.textContent = shown + '곡';
  }
  els.searchBox.addEventListener('input', () => renderDrawerList(els.searchBox.value));

  // ---------- Boot ----------
  fetch('./songs.json')
    .then(r => { if (!r.ok) throw new Error('fetch failed: ' + r.status); return r.json(); })
    .then(data => {
      songs = data.filter(s => s.audio_urls && Object.keys(s.audio_urls).length);
      els.loadingScreen.classList.add('hidden');
      refreshLangLabels();
      renderLibrary();
    })
    .catch(err => {
      els.loadingScreen.textContent = '곡 목록을 불러오지 못했어요. songs.json 파일 위치를 확인해 주세요.';
      console.error(err);
    });

})();
</script>
</body>
</html>
