<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JW Music Library Player</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css');
        body { font-family: 'Pretendard', sans-serif; background-color: #f4f4f6; color: #333; }
        /* 스크롤바 숨기기 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased select-none">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- 모의 데이터베이스 (안전성 강화를 위한 디폴트 프로퍼티 포함) ---
        const MOCK_DATABASE = [
            {
                id: "osg_001",
                category: "오리지널송",
                number: null,
                title: "우리 함께 있어요",
                subtitle: "(We Are There for Each Other)",
                cover_url: "https://placehold.co/600x600/5b4b8a/ffffff?text=Original+Song",
                audio_urls: {
                    ko: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
                    en: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
                    cn: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"
                },
                has_sync: true,
                lyrics: {
                    ko: [
                        { start: 0, end: 5, text: "어떤 어려움을 겪더라도" },
                        { start: 5, end: 12, text: "우리가 함께라면 이겨낼 수 있어요" },
                        { start: 12, end: 20, text: "달콤한 한마디 우리의 말에는" },
                        { start: 20, end: 35, text: "정말 큰 힘이 있어요 함께라면" }
                    ],
                    en: [
                        { start: 0, end: 5, text: "No matter what trials come our way" },
                        { start: 5, end: 12, text: "We'll stand together, come what may" },
                        { start: 12, end: 20, text: "A gentle word can heal and bless" },
                        { start: 20, end: 35, text: "Bringing true peace and happiness" }
                    ],
                    cn: [
                        { start: 0, end: 5, text: "无论面对什么艰难险阻" },
                        { start: 5, end: 12, text: "只要我们并肩就能战胜一切" },
                        { start: 12, end: 20, text: "一句温言充满着力量" },
                        { start: 20, end: 35, text: "带给我们无限的安慰" }
                    ]
                }
            },
            {
                id: "osg_002",
                category: "오리지널송",
                number: null,
                title: "달콤한 한마디",
                subtitle: "(A Gentle Word)",
                cover_url: "https://placehold.co/600x600/5b4b8a/ffffff?text=Original+Song",
                audio_urls: {
                    ko: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",
                    en: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",
                    cn: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"
                },
                has_sync: true,
                lyrics: {
                    ko: [
                        { start: 0, end: 6, text: "지친 마음을 위로하는 그 말" },
                        { start: 6, end: 15, text: "상처받은 영혼을 감싸 안아주네" }
                    ],
                    en: [
                        { start: 0, end: 6, text: "Words that heal a weary soul" },
                        { start: 6, end: 15, text: "Making broken spirits whole" }
                    ],
                    cn: [
                        { start: 0, end: 6, text: "温言抚慰疲倦心灵" },
                        { start: 6, end: 15, text: "带去无限安慰与力量" }
                    ]
                }
            },
            {
                id: "sjj_008",
                category: "'기쁨으로 여호와께 노래하라'—노래",
                number: 8,
                title: "여호와는 우리의 도피처",
                subtitle: "(시편 91)",
                cover_url: "https://placehold.co/600x600/4c3b6b/ffffff?text=Sing+Out+Joyfully",
                audio_urls: {
                    ko: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3",
                    en: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3",
                    cn: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3"
                },
                has_sync: false,
                static_lyrics: {
                    ko: [
                        "1. 여호와 하느님은 우리의 도피처,",
                        "   그 보호 그늘 아래 항상 머물리라.",
                        "   견고한 산성과 같이 늘 충실하신 여호와,",
                        "   굳건히 의지하면 항상 지켜 주시리라.",
                        "",
                        "2. 만 인이 내 곁에서 쓰러질지라도",
                        "   의롭고 온유한 자 늘 보호받으리.",
                        "   그 어떤 재앙이라도 우릴 해치지 못하리.",
                        "   하느님 날개 아래 우린 안전히 거하리."
                    ],
                    en: [
                        "1. Jehovah God is our refuge,",
                        "   Our God in whom we trust.",
                        "   His shadow is our shelter;",
                        "   Remain in it we must."
                    ],
                    cn: [
                        "1. 耶和华是庇护所,救我躲避灾祸。",
                        "   要寻求他的保护,留在安全之处。"
                    ]
                }
            }
        ];

        function App() {
            const [view, setView] = useState('home');
            const [selectedCategory, setSelectedCategory] = useState(null);
            
            const [playlist, setPlaylist] = useState(MOCK_DATABASE);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [isPlaying, setIsPlaying] = useState(false);
            const [currentTime, setCurrentTime] = useState(0);
            const [duration, setDuration] = useState(0);
            
            const [lang, setLang] = useState('ko');
            const [repeatMode, setRepeatMode] = useState('all');
            const [showLangModal, setShowLangModal] = useState(false);

            const audioRef = useRef(null);
            
            // 안전하게 현재 곡 추출 (Undefined 방지)
            const currentSong = (playlist && playlist.length > 0 && playlist[currentIndex]) 
                ? playlist[currentIndex] 
                : (MOCK_DATABASE[0]);

            useEffect(() => {
                const audio = audioRef.current;
                if (!audio) return;

                const updateTime = () => setCurrentTime(audio.currentTime);
                const updateMeta = () => setDuration(audio.duration || 0);
                const handleEnded = () => {
                    if (repeatMode === 'one') {
                        audio.currentTime = 0;
                        audio.play().catch(e => {});
                    } else {
                        handleNext();
                    }
                };

                audio.addEventListener('timeupdate', updateTime);
                audio.addEventListener('loadedmetadata', updateMeta);
                audio.addEventListener('ended', handleEnded);

                return () => {
                    audio.removeEventListener('timeupdate', updateTime);
                    audio.removeEventListener('loadedmetadata', updateMeta);
                    audio.removeEventListener('ended', handleEnded);
                };
            }, [currentIndex, repeatMode, playlist]);

            const togglePlay = () => {
                const audio = audioRef.current;
                if (!audio) return;
                if (isPlaying) {
                    audio.pause();
                } else {
                    audio.play().catch(e => console.log("Play error:", e));
                }
                setIsPlaying(!isPlaying);
            };

            const handleNext = () => {
                if (!playlist || playlist.length === 0) return;
                if (repeatMode === 'shuffle') {
                    const nextRandom = Math.floor(Math.random() * playlist.length);
                    setCurrentIndex(nextRandom);
                } else {
                    setCurrentIndex((prev) => (prev + 1) % playlist.length);
                }
                setCurrentTime(0);
                setIsPlaying(true);
            };

            const handlePrev = () => {
                if (!playlist || playlist.length === 0) return;
                setCurrentIndex((prev) => (prev - 1 + playlist.length) % playlist.length);
                setCurrentTime(0);
                setIsPlaying(true);
            };

            const startPlayCategory = (categoryName, isShuffle = false) => {
                let targetList = MOCK_DATABASE;
                if (categoryName !== '전체') {
                    targetList = MOCK_DATABASE.filter(item => item.category === categoryName);
                }
                if (!targetList || targetList.length === 0) {
                    targetList = MOCK_DATABASE;
                }
                if (isShuffle) {
                    targetList = [...targetList].sort(() => Math.random() - 0.5);
                    setRepeatMode('shuffle');
                } else {
                    setRepeatMode('all');
                }
                setPlaylist(targetList);
                setSelectedCategory(categoryName);
                setCurrentIndex(0);
                setCurrentTime(0);
                setView('player');
                setIsPlaying(true);
                setTimeout(() => {
                    if (audioRef.current) audioRef.current.play().catch(e => {});
                }, 100);
            };

            // 싱크 및 정적 가사 안전 접근 처리
            const activeLyrics = (currentSong && currentSong.has_sync && currentSong.lyrics) 
                ? (currentSong.lyrics[lang] || currentSong.lyrics['ko'] || []) 
                : [];
                
            const activeIndex = activeLyrics.findIndex((line, idx) => {
                const nextLine = activeLyrics[idx + 1];
                return currentTime >= line.start && (!nextLine || currentTime < nextLine.start);
            });

            const staticLines = (currentSong && !currentSong.has_sync && currentSong.static_lyrics)
                ? (currentSong.static_lyrics[lang] || currentSong.static_lyrics['ko'] || [])
                : [];

            return (
                <div className="max-w-md mx-auto min-h-screen bg-slate-50 flex flex-col justify-between shadow-2xl relative overflow-hidden">
                    
                    {/* ==================== 라이브러리 홈 화면 ==================== */}
                    {view === 'home' && (
                        <div className="flex-1 flex flex-col bg-white">
                            <div className="bg-[#4c3b6b] text-white px-4 py-3 flex items-center justify-between shadow-md">
                                <div className="text-sm font-semibold opacity-80">
                                    {lang === 'ko' ? '한국어' : lang === 'en' ? 'English' : '中文'}
                                </div>
                                <div className="text-base font-bold tracking-wide">라이브러리</div>
                                <div className="flex items-center space-x-3">
                                    <button onClick={() => setShowLangModal(true)} className="text-white hover:text-purple-200">
                                        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"/></svg>
                                    </button>
                                </div>
                            </div>

                            <div className="bg-white p-4 border-b border-slate-200 shadow-sm grid grid-cols-2 gap-3">
                                <button 
                                    onClick={() => startPlayCategory('전체', false)}
                                    className="border border-[#4c3b6b] text-[#4c3b6b] py-3 px-4 rounded-xl flex items-center justify-center space-x-2 font-semibold hover:bg-purple-50 transition active:scale-95 shadow-sm"
                                >
                                    <svg className="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                                    <span>전체 재생</span>
                                </button>
                                <button 
                                    onClick={() => startPlayCategory('전체', true)}
                                    className="border border-[#4c3b6b] text-[#4c3b6b] py-3 px-4 rounded-xl flex items-center justify-center space-x-2 font-semibold hover:bg-purple-50 transition active:scale-95 shadow-sm"
                                >
                                    <svg className="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
                                    <span>임의 재생</span>
                                </button>
                            </div>

                            <div className="flex-1 overflow-y-auto divide-y divide-slate-100 pb-20">
                                {[
                                    { title: "오리지널송", desc: "우리의 영적 유산에 감사하는 노래들" },
                                    { title: "'기쁨으로 여호와께 노래하라'—집회", desc: "지상 모임에서 부르는 찬송가 합창" },
                                    { title: "'기쁨으로 여호와께 노래하라'—노래", desc: "오르간 및 보컬 포함 찬송가 전곡" },
                                    { title: "어린이 노래", desc: "여호와의 친구가 되세요 오리지널 송" }
                                ].map((cat, idx) => (
                                    <div 
                                        key={idx}
                                        onClick={() => startPlayCategory(cat.title, false)}
                                        className="p-4 flex items-center justify-between hover:bg-purple-50/50 cursor-pointer transition"
                                    >
                                        <div className="flex items-center space-x-4">
                                            <div className="w-12 h-12 bg-[#4c3b6b]/10 rounded-xl flex items-center justify-center text-[#4c3b6b] font-bold">
                                                🎵
                                            </div>
                                            <div>
                                                <h3 className="font-bold text-slate-900 text-base">{cat.title}</h3>
                                                <p className="text-xs text-slate-500 mt-0.5">{cat.desc}</p>
                                            </div>
                                        </div>
                                        <svg className="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7"/></svg>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}


                    {/* ==================== 플레이어 & 가사 화면 ==================== --> */}
                    {view === 'player' && currentSong && (
                        <div className="flex-1 flex flex-col bg-white">
                            
                            <div className="bg-[#4c3b6b] text-white px-4 py-3 flex items-center justify-between shadow-md">
                                <button 
                                    onClick={() => setView('home')} 
                                    className="flex items-center space-x-1 text-sm font-semibold hover:opacity-80 transition"
                                >
                                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 19l-7-7 7-7"/></svg>
                                    <span>뒤로</span>
                                </button>
                                <div className="text-center">
                                    <h2 className="text-sm font-bold truncate max-w-[180px]">{selectedCategory || currentSong.category}</h2>
                                    <p className="text-[11px] text-purple-200">
                                        {lang === 'ko' ? '한국어' : lang === 'en' ? 'English' : '中文'}
                                    </p>
                                </div>
                                <div className="flex items-center space-x-3">
                                    <button onClick={() => setShowLangModal(true)} className="p-1 hover:bg-white/10 rounded-lg transition" title="언어 선택">
                                        <span className="text-xs font-bold border border-white/40 px-1.5 py-0.5 rounded">
                                            {lang.toUpperCase()}
                                        </span>
                                    </button>
                                    <button 
                                        onClick={() => {
                                            if (repeatMode === 'all') setRepeatMode('one');
                                            else if (repeatMode === 'one') setRepeatMode('shuffle');
                                            else setRepeatMode('all');
                                        }} 
                                        className="text-white hover:opacity-80 transition text-sm"
                                        title={`재생 모드: ${repeatMode}`}
                                    >
                                        {repeatMode === 'one' ? '🔂' : repeatMode === 'shuffle' ? '🔀' : '🔁'}
                                    </button>
                                </div>
                            </div>

                            <div className="flex-1 overflow-y-auto px-6 py-6 flex flex-col items-center text-center">
                                <div className="w-full text-left mb-6 border-b border-slate-100 pb-4">
                                    {currentSong.number && (
                                        <span className="text-xs font-bold text-[#4c3b6b] tracking-wider uppercase">
                                            {currentSong.number}번
                                        </span>
                                    )}
                                    <h1 className="text-2xl font-bold text-slate-900 mt-1 tracking-tight">
                                        {currentSong.title}
                                    </h1>
                                    <p className="text-xs text-slate-500 mt-0.5">{currentSong.subtitle}</p>
                                </div>

                                <div className="w-full flex-1 flex flex-col justify-center items-center py-4">
                                    {currentSong.has_sync ? (
                                        <div className="space-y-6 w-full py-10">
                                            {activeLyrics.map((line, idx) => {
                                                const isActive = idx === activeIndex;
                                                const isPast = idx < activeIndex;
                                                return (
                                                    <p
                                                        key={idx}
                                                        onClick={() => {
                                                            if (audioRef.current) audioRef.current.currentTime = line.start;
                                                        }}
                                                        className={`transition-all duration-300 cursor-pointer px-4 ${
                                                            isActive 
                                                                ? 'text-xl font-bold text-[#4c3b6b] scale-105 drop-shadow-sm' 
                                                                : isPast 
                                                                ? 'text-base font-medium text-slate-400 opacity-50 blur-[0.2px]' 
                                                                : 'text-base font-medium text-slate-500 opacity-60 hover:opacity-90'
                                                        }`}
                                                    >
                                                        {line.text}
                                                    </p>
                                                );
                                            })}
                                        </div>
                                    ) : (
                                        <div className="space-y-3 w-full text-left py-2">
                                            {staticLines.map((line, idx) => (
                                                <p key={idx} className="text-sm font-medium text-slate-700 leading-relaxed">
                                                    {line}
                                                </p>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>

                            <div className="bg-white border-t border-slate-200 p-4 shadow-lg flex flex-col space-y-3">
                                <div className="space-y-1">
                                    <input
                                        type="range"
                                        min={0}
                                        max={duration || 100}
                                        value={currentTime}
                                        onChange={(e) => {
                                            const val = Number(e.target.value);
                                            setCurrentTime(val);
                                            if (audioRef.current) audioRef.current.currentTime = val;
                                        }}
                                        className="w-full h-1 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-[#4c3b6b]"
                                    />
                                    <div className="flex justify-between text-[11px] text-slate-400 font-medium px-0.5">
                                        <span>{Math.floor(currentTime / 60)}:{('0' + Math.floor(currentTime % 60)).slice(-2)}</span>
                                        <span>{Math.floor(duration / 60)}:{('0' + Math.floor(duration % 60)).slice(-2)}</span>
                                    </div>
                                </div>

                                <div className="flex items-center justify-between">
                                    <div className="flex items-center space-x-3 min-w-0 flex-1">
                                        <img 
                                            src={currentSong.cover_url} 
                                            alt="cover" 
                                            className="w-12 h-12 rounded-lg object-cover shadow border border-slate-200 flex-shrink-0" 
                                        />
                                        <div className="min-w-0 flex-1">
                                            <h4 className="text-xs font-bold text-slate-900 truncate">{currentSong.title}</h4>
                                            <p className="text-[10px] text-slate-500 truncate mt-0.5">{currentSong.category}</p>
                                        </div>
                                    </div>

                                    <div className="flex items-center space-x-4 flex-shrink-0">
                                        <button onClick={handlePrev} className="text-slate-600 hover:text-[#4c3b6b] transition active:scale-95 p-1">
                                            <svg className="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                                        </button>
                                        <button
                                            onClick={togglePlay}
                                            className="w-11 h-11 rounded-full bg-[#4c3b6b] text-white flex items-center justify-center shadow-md hover:bg-[#3b2d54] transition active:scale-95"
                                        >
                                            {isPlaying ? (
                                                <svg className="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                                            ) : (
                                                <svg className="w-5 h-5 fill-current ml-0.5" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                                            )}
                                        </button>
                                        <button onClick={handleNext} className="text-slate-600 hover:text-[#4c3b6b] transition active:scale-95 p-1">
                                            <svg className="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {showLangModal && (
                        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
                            <div className="bg-white rounded-2xl p-6 max-w-xs w-full shadow-2xl">
                                <h3 className="text-base font-bold text-slate-900 mb-4 text-center">언어 선택 (Language)</h3>
                                <div className="space-y-2">
                                    {[
                                        { code: 'ko', label: '한국어 (Korean)' },
                                        { code: 'en', label: 'English (영어)' },
                                        { code: 'cn', label: '中文 (중국어)' }
                                    ].map((item) => (
                                        <button
                                            key={item.code}
                                            onClick={() => {
                                                setLang(item.code);
                                                setShowLangModal(false);
                                            }}
                                            className={`w-full py-3 px-4 rounded-xl text-sm font-semibold flex items-center justify-between transition ${
                                                lang === item.code 
                                                    ? 'bg-[#4c3b6b] text-white shadow' 
                                                    : 'bg-slate-100 text-slate-700 hover:bg-slate-200'
                                            }`}
                                        >
                                            <span>{item.label}</span>
                                            {lang === item.code && <span>✓</span>}
                                        </button>
                                    ))}
                                </div>
                                <button
                                    onClick={() => setShowLangModal(false)}
                                    className="w-full mt-4 py-2.5 text-xs font-bold text-slate-500 hover:text-slate-800 transition"
                                >
                                    닫기
                                </button>
                            </div>
                        </div>
                    )}

                    <audio 
                        ref={audioRef} 
                        src={currentSong ? (currentSong.audio_urls[lang] || currentSong.audio_urls['ko']) : ''} 
                        preload="metadata" 
                    />
